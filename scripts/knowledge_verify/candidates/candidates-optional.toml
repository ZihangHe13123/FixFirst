distribution = "python"
version = "3.13"
replacement = "a certificate chain that satisfies RFC 5280, which is the proper fix: re-issue the certificate with the missing part (a Key Usage extension (with keyCertSign) on every CA certificate). ssl.create_default_context() sets ssl.VERIFY_X509_STRICT from Python 3.13, which rejects pre-RFC 5280 or malformed certificates that older releases accepted. If the certificates cannot be replaced, the release notes show how to turn only that check off: ctx = ssl.create_default_context(); ctx.verify_flags &= ~ssl.VERIFY_X509_STRICT (not recommended; certificate and hostname verification stay on)"
source = "python-3.13"

