# ======================================================================================
# BONUS, OUTSIDE THE REQUESTED RANGE: names removed in Python 3.9 (verified against 3.8).
# Included because these are among the most frequent breakages of legacy code that is run
# on a current interpreter. The whole section can be dropped without affecting the rest.
# ======================================================================================

[[removed]]
kind = "api"
module = "base64"
names = ["encodestring", "decodestring"]
distribution = "python"
version = "3.9"
replacement = "base64.encodebytes() and base64.decodebytes() (encodestring -> encodebytes, decodestring -> decodebytes): the same arguments and the same bytes result"
source = "python-3.9"

[[removed]]
kind = "api"
module = "fractions"
names = ["gcd"]
distribution = "python"
version = "3.9"
replacement = "math.gcd(), with two differences to check: it always returns a non-negative int (fractions.gcd(4, -6) was -2, math.gcd(4, -6) is 2, because fractions.gcd gave the result the sign of b) and it accepts only integers, whereas fractions.gcd also accepted Fraction arguments"
source = "python-3.9"

[[removed]]
kind = "api"
module = "plistlib"
names = ["readPlist", "writePlist", "readPlistFromBytes", "writePlistToBytes", "Data"]
distribution = "python"
version = "3.9"
replacement = "plistlib.load(fp) and plistlib.dump(value, fp) with a file opened in binary mode ('rb' / 'wb'; the old functions also took a file name), plistlib.loads(data) in place of readPlistFromBytes and plistlib.dumps(value) in place of writePlistToBytes (the XML output is identical). Binary <data> values now come back as bytes instead of plistlib.Data, so use bytes objects instead of Data"
source = "python-3.9"

[[removed]]
kind = "api"
module = "sys"
names = ["getcheckinterval", "setcheckinterval"]
distribution = "python"
version = "3.9"
replacement = "sys.getswitchinterval() and sys.setswitchinterval(seconds). The units differ: the check interval counted bytecode instructions (default 100), the switch interval is a time in seconds (default 0.005), so the old values cannot be converted; choose a switch interval that suits the program, or drop the call"
source = "python-3.9"

[[removed]]
kind = "api"
module = "wave"
names = ["openfp"]
distribution = "python"
version = "3.9"
replacement = "wave.open(), which openfp was an alias of"
source = "python-3.9"

[[removed]]
kind = "module"
names = ["_dummy_thread", "dummy_threading"]
distribution = "python"
version = "3.9"
replacement = "threading: Python 3.7 and newer always provide it, so the dummy fallbacks are no longer needed"
source = "python-3.9"

[[removed]]
kind = "kwarg"
names = ["buffering"]
callables = ["bz2.BZ2File"]
distribution = "python"
version = "3.9"
replacement = "bz2.BZ2File without buffering=: the argument was ignored since Python 3.0 (a DeprecationWarning said so). Pass an already opened file object to control how the file is opened"
source = "python-3.9"

