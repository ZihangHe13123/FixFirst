# Verified knowledge-base additions: file role TIER 2 (optional). This file holds 476 blocks (471 removed, 4 deprecated, 1 unmaintained) and 76 source tables defined in this file.
# Every block was checked by running the interpreter or library before and after the stated release, and each cites an official
# release note or API-change page. The checks and the machine-readable record of the last run are in scripts/knowledge_verify
# (verify.py, receipts/). Tier 1 = the names users hit most often on current releases; tier 2 = the verified long tail. The blocks
# of candidates.toml and candidates-optional.toml are in src/fixfirst/knowledge/domain.toml; the blocks of candidates-parked.toml
# are verified too but are NOT enabled (src/fixfirst/knowledge/pending_attribution.toml).
# Merge the two tier files together: a tier-2 block may use a [sources."id"] table defined in candidates.toml. No source id or
# removed key is defined twice, or in the domain.toml that preceded these additions (git show 769028d:src/fixfirst/knowledge/domain.toml).
# Research tracks: Python standard library 3.10-3.14 (and a 3.9 group, tier 2 only); setuptools / pkg_resources / distutils shim;
# unmaintained packages; NumPy and SciPy; pandas, scikit-learn, matplotlib; Django, Flask, Werkzeug, Jinja2, MarkupSafe,
# itsdangerous; pydantic, SQLAlchemy, pytest, attrs, click; urllib3, requests, Pillow, networkx, openai, six, beautifulsoup4
# (requests, six and beautifulsoup4 produced no entry).
# Left out because a probe showed the replacement text was wrong: the SciPy blocks scipy.signal.barthann + 18 more window names (1.13),
# scipy.signal.hanning (1.9) and scipy.signal.windows.hanning (1.9) (get_window('hann', M) returns the periodic window, not
# windows.hann(M); probe sup-sp-1.13-get-window-is-periodic), and the scikit-learn blocks OneHotEncoder.get_feature_names and
# ColumnTransformer.get_feature_names (1.2) (get_feature_names_out() gives other names for DataFrame input; probe
# sup-sk12-feature-names-dataframe-differs). Their removal checks still run (listed as checked keys that no entry uses).
# Corrected after review (2026-10-03): the replacement texts of pkg_resources.resource_* (Traversable has no exists()),
# pkgutil.ImpImporter/ImpLoader (the setuptools advice is 'setuptools>=66.1,<82'), DataFrame.lookup (no blanket same-dtype promise)
# and DataFrame.first/last (convert the string offset, guard the empty frame), each with new probes for the reviewer's
# counterexamples. Blocks that match a bare attribute name or a class name are parked, not enabled: FixFirst cannot yet bind such an
# error to the object's real module, so a project's own class of the same name would be diagnosed as a version problem.

# ==================================================================================================
# OPTIONAL (TIER 2) - verified, lower priority: long tail, rare names, older releases. Merge together with candidates.toml: some blocks reference sources defined there
# ==================================================================================================

