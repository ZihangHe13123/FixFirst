# resources (client.edits, client.fine_tunes); they exist in 1.0 to 1.7.1 only.
# ======================================================================================

[[removed]]
kind = "api"
module = "OpenAI"
names = ["edits"]
distribution = "openai"
version = "1.7.2"
replacement = "client.chat.completions.create(model=..., messages=[...]) with the instruction and the text in the prompt: the Edits endpoint is no longer part of the SDK, and the client.edits resource that the openai 1.0 migration guide lists was removed in 1.7.2 together with the other deprecated endpoints."
source = "openai-1.7.2"

[[removed]]
kind = "api"
module = "OpenAI"
names = ["fine_tunes"]
distribution = "openai"
version = "1.7.2"
replacement = "client.fine_tuning.jobs: jobs.create(training_file=..., model=...), jobs.list(), jobs.retrieve(job_id), jobs.cancel(job_id) and jobs.list_events(job_id). The client.fine_tunes resource that the openai 1.0 migration guide lists was removed in 1.7.2 together with the other deprecated endpoints."
source = "openai-1.7.2"

[[removed]]
kind = "api"
module = "AsyncOpenAI"
names = ["edits"]
distribution = "openai"
version = "1.7.2"
replacement = "client.chat.completions.create(model=..., messages=[...]) with the instruction and the text in the prompt: the Edits endpoint is no longer part of the SDK, and the client.edits resource that the openai 1.0 migration guide lists was removed in 1.7.2 together with the other deprecated endpoints."
source = "openai-1.7.2"

[[removed]]
kind = "api"
module = "AsyncOpenAI"
names = ["fine_tunes"]
distribution = "openai"
version = "1.7.2"
replacement = "client.fine_tuning.jobs: jobs.create(training_file=..., model=...), jobs.list(), jobs.retrieve(job_id), jobs.cancel(job_id) and jobs.list_events(job_id). The client.fine_tunes resource that the openai 1.0 migration guide lists was removed in 1.7.2 together with the other deprecated endpoints."
source = "openai-1.7.2"

