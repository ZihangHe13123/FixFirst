[[removed]]
kind = "attribute"
owners = ["threading.Thread"]
names = ["isAlive"]
distribution = "python"
version = "3.9"
replacement = "is_alive(): the same method under its PEP 8 name"
source = "python-3.9"

[[removed]]
kind = "api"
module = "HTMLParser"
names = ["unescape"]
distribution = "python"
version = "3.9"
replacement = "html.unescape(s), the module-level function that the removed method called (import html)"
