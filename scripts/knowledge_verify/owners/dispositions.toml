# What became of the 114 verified candidates of candidates/candidates-parked.toml (see verify_owners.py and the README).
#
# enabled   the block is in domain.toml with `owners` (every key of it has a passing record in the owners receipt);
# merged    not enabled because an enabled entry already covers the same removal (`covered_by`). The covering entry is the one of `covered_by`
#           that ends in the same attribute; it must have the same distribution, removal version and source as the merged key, and the same
#           replacement or a `replacement_note` that says why not. verify_owners.py verifies every merged key with the receiver of its own
#           class (the `merged` section of the owners receipt): every release authorizes it through the covering entry and no other, and
#           FixFirst authorizes exactly that entry;
# parked    still in src/fixfirst/knowledge/pending_attribution.toml, with the reason.
# tests/test_knowledge_owners.py checks that every candidate key has exactly one of these states, and that nothing is listed twice.

