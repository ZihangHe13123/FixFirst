[[parked]]
title = "SQLAlchemy expression and Query classes"
keys = ["api:CompoundSelect.c", "api:CompoundSelect.columns", "api:CompoundSelect.select", "api:Delete.execute", "api:Insert.execute", "api:Query.from_self", "api:Select.apply_labels", "api:Select.c", "api:Select.columns", "api:Select.execute", "api:Select.select", "api:Table.exists", "api:TextualSelect.c", "api:TextualSelect.columns", "api:TextualSelect.select", "api:Update.execute"]
why = "The receiver's class has more than 16 base classes (SQLAlchemy 2.1: Table 41, Select 44, Insert 34, Update 35, Delete 34, CompoundSelect 39, TextualSelect 34, Query 20), and the product's receiver probe records no identity beyond 16 (receiver_owners and static_namespace in fixfirst/_runtime_evidence.py). Two further caps stop the same classes: receiver_owners drops the whole set when it would hold 32 or more alias rows, and symbol_context.valid_record accepts at most 32 rows. With the three caps raised (64, 512, 512) in a scratch copy, all 16 keys of these classes pass verify_owners.py, FixFirst's own run included, with owners such as sqlalchemy.Select and sqlalchemy.sql.selectable.Select; the caps are a product decision."

[[parked]]
title = "Django settings"
keys = ["api:Settings.DEFAULT_FILE_STORAGE", "api:Settings.PASSWORD_RESET_TIMEOUT_DAYS", "api:Settings.STATICFILES_STORAGE", "api:Settings.USE_L10N"]
why = "settings is a LazySettings proxy: the receiver's class is django.conf.LazySettings, not Settings, and the lookup fails inside Django's own __getattr__ (getattr(self._wrapped, name)), which the product does not observe; it records only a failing attribute load in the code it runs. FixFirst still reports a version incompatibility from its release heuristic H02, without naming the setting."

