why = "Engine.execute is already enabled as attribute:sqlalchemy.engine.base.Engine.execute with the same removal and source; a second entry would show the step twice."
replacement_note = "Both texts give the same remedy (an explicit connection: with engine.connect() as connection, connection.execute(text(sql), parameters), engine.begin() for statements that must commit, bound parameters); the enabled entry spells out the text() import and is the one the product shows."

[[parked]]
title = "matplotlib Axes.ArtistList"
keys = ["api:ArtistList.append", "api:ArtistList.clear", "api:ArtistList.extend", "api:ArtistList.insert", "api:ArtistList.pop", "api:ArtistList.remove"]
why = "ArtistList is a class nested in _AxesBase (qualified name _AxesBase.ArtistList). The product records the class of a receiver only when a module holds it under its qualified name (class_identity), so no owner can ever match it."

[[parked]]
title = "Django settings"
keys = ["api:Settings.DEFAULT_FILE_STORAGE", "api:Settings.PASSWORD_RESET_TIMEOUT_DAYS", "api:Settings.STATICFILES_STORAGE", "api:Settings.USE_L10N"]
why = "settings is a LazySettings proxy: the receiver's class is django.conf.LazySettings, not Settings, and the lookup fails inside Django's own __getattr__ (getattr(self._wrapped, name)), which the product does not observe; it records only a failing attribute load in the code it runs. FixFirst still reports a version incompatibility from its release heuristic H02, without naming the setting."

[[parked]]
title = "array.array"
