[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fixfirst-local"
version = "0.8.0rc1"
description = "Evidence-based local Python troubleshooting assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.8,<3", "Jinja2>=3.1,<4", "scikit-learn>=1.5,<2", "packaging>=24.2,<27", "PyYAML>=6,<7", "tomli>=2,<3; python_version < '3.11'"]

[project.optional-dependencies]
# PyYAML is also a runtime parser; Click 8.2 is needed by API regression fixtures.
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1,<2", "click>=8.2,<9"]
semantic = ["sentence-transformers>=3,<6"]
notebooks = ["nbclient>=0.10,<1", "nbformat>=5.10,<6", "ipykernel>=6,<8"]

[project.scripts]
fixfirst = "fixfirst.cli:main"

[tool.setuptools.package-data]
fixfirst = ["templates/*", "knowledge/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
# generated and hashed by the verification record (scripts/knowledge_verify): editing it would invalidate the receipts
extend-exclude = ["scripts/knowledge_verify/verify.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
