# ==================================================================================================
# Django settings
# settings is a LazySettings proxy: the receiver's class is django.conf.LazySettings, not
# Settings, and the lookup fails inside Django's own __getattr__ (getattr(self._wrapped, name)),
# which the product does not observe; it records only a failing attribute load in the code it
# runs. FixFirst still reports a version incompatibility from its release heuristic H02, without
# naming the setting.
# ==================================================================================================

[[removed]]
kind = "api"
module = "Settings"
names = ["DEFAULT_FILE_STORAGE"]
distribution = "Django"
version = "5.1"
replacement = "settings.STORAGES['default']['BACKEND'] (the STORAGES setting, available since Django 4.2). A DEFAULT_FILE_STORAGE value assigned in settings.py is ignored from Django 5.1 on, so move it into STORAGES; if a traceback shows an installed package reading settings.DEFAULT_FILE_STORAGE, upgrade that package."
source = "django-5.1-removed"

[[removed]]
kind = "api"
module = "Settings"
names = ["STATICFILES_STORAGE"]
distribution = "Django"
version = "5.1"
replacement = "settings.STORAGES['staticfiles']['BACKEND'] (the STORAGES setting, available since Django 4.2). A STATICFILES_STORAGE value assigned in settings.py is ignored from Django 5.1 on, so move it into STORAGES; if a traceback shows an installed package reading settings.STATICFILES_STORAGE, upgrade that package."
source = "django-5.1-removed"

[[removed]]
kind = "api"
module = "Settings"
names = ["PASSWORD_RESET_TIMEOUT_DAYS"]
distribution = "Django"
version = "4.0"
replacement = "settings.PASSWORD_RESET_TIMEOUT, which counts seconds instead of days (3 days is 259200). A PASSWORD_RESET_TIMEOUT_DAYS value assigned in settings.py is ignored from Django 4.0 on, so convert it; if a traceback shows an installed package reading the old setting, upgrade that package."
source = "django-4.0-removed"

[[removed]]
kind = "api"
module = "Settings"
names = ["USE_L10N"]
distribution = "Django"
version = "5.0"
replacement = "no setting: localized formatting of dates and numbers is always on since Django 5.0 (a USE_L10N = False in settings.py is ignored; the {% localize off %} tag and the unlocalize filter still switch it off for a template), so delete the reads and assume True. If a traceback shows an installed package reading settings.USE_L10N, upgrade that package."
source = "django-5.0-removed"

