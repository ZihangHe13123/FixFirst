# pytest 8.0 -> 8.1 (the PytestRemovedIn8Warning errors of 8.0 turn into removals)
# ------------------------------------------------------------------------------------------

[[removed]]
kind = "kwarg"
names = ["msg"]
callables = ["pytest.skip", "pytest.fail", "pytest.exit"]
distribution = "pytest"
version = "8.1"
replacement = "reason= (pytest.skip(reason='...'), pytest.fail(reason='...'), pytest.exit(reason='...')), the keyword that replaced msg, with the same text; pytest.skip(msg=..., allow_module_level=True) becomes pytest.skip(reason=..., allow_module_level=True)."
source = "pytest-deprecations-msg"

# ------------------------------------------------------------------------------------------
# pytest 8.3 -> 8.4
# ------------------------------------------------------------------------------------------

[[removed]]
kind = "usage"
names = ["pytest yield test"]
pattern = "'yield' keyword is allowed in fixtures, but not in tests"
distribution = "pytest"
version = "8.4"
replacement = "@pytest.mark.parametrize: turn each yielded tuple into a parameter set, for example @pytest.mark.parametrize('x, y', [(2, 4), (3, 9)]) on def test_squared(x, y): assert x * x == y. yield-style tests have not run since pytest 4.0, and pytest 8.4 reports them as a collection error instead of an expected failure."
source = "pytest-deprecations-yield-tests"

[[removed]]
kind = "usage"
names = ["pytest async test without a plugin"]
pattern = "async def functions are not natively supported"
distribution = "pytest"
version = "8.4"
replacement = "an async test plugin installed in the interpreter that runs pytest: pytest-asyncio (mark the tests with @pytest.mark.asyncio, or set asyncio_mode = auto in the pytest configuration), anyio (@pytest.mark.anyio), pytest-trio, pytest-tornasync or pytest-twisted. pytest itself cannot run async def tests; before 8.4 it skipped them with a warning, so they were never executed."
source = "pytest-changelog-8.4-async"

# ------------------------------------------------------------------------------------------
# older removals
# ------------------------------------------------------------------------------------------

[[removed]]
kind = "usage"
names = ["pytest fixture called directly"]
pattern = "Fixtures are not meant to be called directly"
distribution = "pytest"
version = "4.0"
replacement = "the fixture requested as a parameter (def test_a(fix): ...); when another fixture or helper needs the value, a plain function holding the logic that the fixture wraps (def make_fix(): return 1 with @pytest.fixture def fix(): return make_fix()), or request.getfixturevalue('fix') to fetch it by name. Fixture functions cannot be called like ordinary functions in pytest 4 and later."
source = "pytest-deprecations-fixture-directly"

