pattern = "`regex` is removed. use `pattern` instead"
distribution = "pydantic"
version = "2.0"
replacement = "Field(pattern=...) with the same regular expression, for example Field(..., pattern='^[a-z]+$'). V2 matches patterns with the Rust regex engine, which has no look-around or back-references; ConfigDict(regex_engine='python-re') selects Python's re module when the pattern needs them. Re-test the accepted values of the field."
source = "pydantic-2.0-field"

[[removed]]
kind = "usage"
names = ["pydantic unannotated field"]
pattern = "A non-annotated attribute was detected"
distribution = "pydantic"
version = "2.0"
replacement = "an annotation on every attribute that should be a field (retries: int = 3), because V2 no longer infers a field from the type of the default value. For a class-level constant that must not become a field write retries: ClassVar[int] = 3, and list other non-field attribute types in model_config['ignored_types']. Check the model's field list after the change."
source = "pydantic-usage-error-unannotated"

[[removed]]
kind = "usage"
names = ["pydantic validator field/config arguments"]
pattern = "The `field` and `config` parameters are not available in Pydantic V2"
distribution = "pydantic"
version = "2.0"
replacement = "a @field_validator (from pydantic import field_validator, ValidationInfo) whose last parameter is info: ValidationInfo: info.field_name is the field name (cls.model_fields[info.field_name] is its FieldInfo), info.config the model config and info.data the earlier validated fields, replacing the field, config and values arguments. The deprecated @validator still passes values but no longer accepts field and config."
source = "pydantic-2.0-validator-signatures"

[[removed]]
kind = "usage"
names = ["pydantic BaseModel.json(**dumps_kwargs)"]
pattern = "`dumps_kwargs` keyword arguments are no longer supported."
distribution = "pydantic"
version = "2.0"
replacement = "model_dump_json(indent=2) when only indent was passed (it also takes by_alias, exclude_none and similar options), and json.dumps(model.model_dump(mode='json'), **options) for the other json.dumps options such as sort_keys, ensure_ascii, separators and default. model_dump_json() output has no spaces after separators unless indent is set, so compare the JSON text where it is checked literally."
source = "pydantic-2.0-model"

# ------------------------------------------------------------------------------------------
# pydantic 1.10 -> 2.0: keyword arguments of the constrained-type helper functions
# ------------------------------------------------------------------------------------------

[[removed]]
kind = "kwarg"
names = ["constr.regex"]
callables = ["pydantic.constr", "pydantic.types.constr"]
distribution = "pydantic"
version = "2.0"
replacement = "pattern= (constr(pattern='^a')), the V2 name of the regular-expression argument. V2 matches with the Rust regex engine, which has no look-around or back-references. Re-test the accepted strings."
source = "pydantic-2.0-constrained"

[[removed]]
kind = "kwarg"
names = ["conlist.min_items", "conlist.max_items", "conset.min_items", "conset.max_items", "confrozenset.min_items", "confrozenset.max_items"]
callables = ["pydantic.conlist", "pydantic.types.conlist", "pydantic.conset", "pydantic.types.conset", "pydantic.confrozenset", "pydantic.types.confrozenset"]
distribution = "pydantic"
version = "2.0"
replacement = "min_length= and max_length= with the same values, for example conlist(int, min_length=1, max_length=3); the same rename applies to conset and confrozenset. Annotated[List[int], Field(min_length=1, max_length=3)] is the equivalent without the helper function."
source = "pydantic-2.0-field"

# ------------------------------------------------------------------------------------------
# pydantic 1.10 -> 2.0: names the migration guide lists as removed (they raise PydanticImportError)
# ------------------------------------------------------------------------------------------

[[removed]]
kind = "api"
module = "pydantic"
names = ["ConstrainedBytes", "ConstrainedDate", "ConstrainedDecimal", "ConstrainedFloat", "ConstrainedFrozenSet", "ConstrainedInt", "ConstrainedList", "ConstrainedSet", "ConstrainedStr"]
distribution = "pydantic"
version = "2.0"
replacement = "Annotated[<type>, Field(...)] with the constraint names of the old class attributes, for example MyInt = Annotated[int, Field(ge=0)] in place of class MyInt(ConstrainedInt): ge = 0. For ConstrainedStr use Annotated[str, StringConstraints(pattern=..., max_length=...)] (pydantic.StringConstraints, from pydantic 2.1) or constr(pattern=..., max_length=...); regex becomes pattern. Define the alias once, use it in the annotations and re-test the constrained fields."
source = "pydantic-2.0-constrained"

[[removed]]
kind = "api"
module = "pydantic"
names = ["parse_file_as", "parse_raw_as"]
distribution = "pydantic"
version = "2.0"
replacement = "pydantic.TypeAdapter: TypeAdapter(T).validate_json(data) in place of parse_raw_as(T, data), and TypeAdapter(T).validate_json(Path(path).read_text()) in place of parse_file_as(T, path). Build the TypeAdapter once and reuse it. The V1 proto and content_type arguments have no counterpart: load the data first, then validate it."
source = "pydantic-2.0-typeadapter"

# ------------------------------------------------------------------------------------------
# pydantic 1.10 -> 2.0: names that fail with a plain ImportError (not in the guide's removed list)
# ------------------------------------------------------------------------------------------

[[removed]]
kind = "api"
module = "pydantic.env_settings"
names = ["BaseSettings"]
distribution = "pydantic"
version = "2.0"
replacement = "pydantic_settings.BaseSettings (pip install pydantic-settings; from pydantic_settings import BaseSettings), configured through model_config = SettingsConfigDict(env_prefix=..., env_file=...) instead of an inner class Config, with Field(validation_alias='NAME') replacing Field(env='NAME'). Re-test which environment variables are read."
source = "pydantic-2.0"

# ------------------------------------------------------------------------------------------
# SQLAlchemy 1.4 -> 2.0: usage entries (distinctive error text)
# ------------------------------------------------------------------------------------------

[[removed]]
kind = "usage"
names = ["sqlalchemy Connection.execute(str)"]
pattern = "Not an executable object: '"
distribution = "SQLAlchemy"
version = "2.0"
replacement = "text() around the SQL string (from sqlalchemy import text; conn.execute(text('select ...'))) with bound parameters in a dictionary, conn.execute(text('... :id'), {'id': 1}), instead of values formatted into the SQL; conn.exec_driver_sql(sql, params) passes the string straight to the DBAPI with its own paramstyle. A connection from engine.connect() does not autocommit in 2.0: call conn.commit(), or use engine.begin() for statements that must be committed. If the object named in the error is not an SQL string, pass an executable construct such as select()."
source = "sqlalchemy-2.0-execute-strict"

[[removed]]
kind = "usage"
names = ["sqlalchemy Session.execute(str)"]
pattern = "should be explicitly declared as text("
distribution = "SQLAlchemy"
version = "2.0"
replacement = "text() around the SQL string, for example session.execute(text('select ...'), {'id': 1}) with bound parameters in a dictionary; the same text() wrapper is needed for plain strings passed to select(), where() and similar clause methods."
source = "sqlalchemy-2.0-execute-strict"

[[removed]]
kind = "usage"
names = ["sqlalchemy Connection.execute(**kwargs)"]
pattern = "Connection.execute() got an unexpected keyword argument"
distribution = "SQLAlchemy"
version = "2.0"
replacement = "a single parameters dictionary as the second argument: conn.execute(text('select :x'), {'x': 1}), or a list of dictionaries for several rows (conn.execute(table.insert(), [{...}, {...}])). Connection.execute() no longer accepts bound parameters as keyword arguments."
source = "sqlalchemy-2.0-execute-strict"

[[removed]]
kind = "usage"
names = ["sqlalchemy MetaData.create_all() without an engine"]
pattern = "create_all() missing 1 required positional argument: 'bind'"
distribution = "SQLAlchemy"
version = "2.0"
replacement = "the engine passed explicitly: metadata.create_all(engine) (or a connection, metadata.create_all(conn) inside engine.begin()). MetaData.bind was removed, so assigning metadata.bind = engine has no effect in 2.0."
source = "sqlalchemy-2-execute"

[[removed]]
kind = "usage"
names = ["sqlalchemy Table(autoload=True)"]
pattern = "Additional arguments should be named <dialectname>_<argument>, got 'autoload'"
distribution = "SQLAlchemy"
version = "2.0"
replacement = "autoload_with=engine alone: Table('users', metadata, autoload_with=engine) reflects the table, and the autoload=True flag is gone together with bound metadata, so drop it. Reflection needs the engine (or a connection) passed explicitly."
source = "sqlalchemy-2.0-changelog-general"

[[removed]]
kind = "usage"
names = ["sqlalchemy select([columns])"]
pattern = "Column expression, FROM clause, or other columns clause element expected, got ["
distribution = "SQLAlchemy"
version = "2.0"
replacement = "select() with the columns or tables as positional arguments: select(users.c.id, users.c.name) in place of select([users.c.id, users.c.name]), select(users) for a whole table, and select(*columns) when the columns are already in a list. The legacy keywords whereclause= and from_obj= become the generative .where() and .select_from() calls."
source = "sqlalchemy-2.0-select-positional"

[[removed]]
kind = "usage"
names = ["sqlalchemy Query.join(relationship name string)"]
pattern = "Join target, typically a FROM expression, or ORM relationship attribute expected"
distribution = "SQLAlchemy"
version = "2.0"
replacement = "the class-bound relationship attribute or the target entity: query.join(User.items) or query.join(Item, User.id == Item.user_id) in place of query.join('items'); a list of attributes becomes chained calls, query.join(User.items).join(Item.tags), and select(User).join(User.items) is the 2.0 form."
source = "sqlalchemy-2.0-query-strings"

[[removed]]
kind = "usage"
names = ["sqlalchemy Row.keys()"]
pattern = "Could not locate column in row for column 'keys'"
distribution = "SQLAlchemy"
version = "2.0"
replacement = "row._mapping.keys(): Row is a named tuple in 2.0 and the mapping interface moved to the Row._mapping attribute; result.keys() gives the column names of a whole result."
source = "sqlalchemy-2.0-row"

# ------------------------------------------------------------------------------------------
# SQLAlchemy 1.4 -> 2.0: keyword arguments
# ------------------------------------------------------------------------------------------

[[removed]]
kind = "kwarg"
names = ["MetaData.bind"]
callables = ["sqlalchemy.MetaData", "sqlalchemy.schema.MetaData", "sqlalchemy.sql.schema.MetaData"]
distribution = "SQLAlchemy"
version = "2.0"
replacement = "no bind argument: keep the engine in a variable and pass it where it is needed, metadata.create_all(engine), metadata.reflect(bind=engine), Table(..., autoload_with=engine) and connection.execute(statement). Bound metadata and implicit execution were removed in 2.0."
source = "sqlalchemy-2-execute"

# ------------------------------------------------------------------------------------------
# SQLAlchemy 1.3 -> 1.4
# ------------------------------------------------------------------------------------------

[[removed]]
kind = "usage"
names = ["sqlalchemy postgres:// URL"]
pattern = "Can't load plugin: sqlalchemy.dialects:postgres"
distribution = "SQLAlchemy"
version = "1.4"
replacement = "postgresql:// as the URL scheme (create_engine('postgresql://user:pw@host/db')), also in DATABASE_URL values that still say postgres://; the postgres dialect name was removed in 1.4. If the URL already starts with postgresql, the name after the dot in the error is a driver that is not available."
source = "sqlalchemy-1.4-changelog"

