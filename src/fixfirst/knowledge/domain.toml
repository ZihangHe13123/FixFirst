pattern = "exceptions must be derived from Warning, not <class 'NoneType'>"
distribution = "pytest"
version = "8.0"
replacement = "pytest.warns(SomeWarning), or the recwarn fixture / warnings.catch_warnings() to record warnings without expecting one"
source = "pytest-deprecations"

