# --------------------------------------------------------------------------------------------------

# --------------------------------------------------------------------------------------
# Removed in Python 3.10
# --------------------------------------------------------------------------------------

[[removed]]
kind = "module"
names = ["formatter"]
distribution = "python"
version = "3.10"
replacement = "your own copy of the formatter classes you need (AbstractFormatter, AbstractWriter, NullFormatter, NullWriter, DumbWriter): the module was obsolete, little used and untested, and has no standard-library replacement, so copy those classes into your project or stop using them"
source = "python-3.10"

[[removed]]
kind = "module"
names = ["parser"]
distribution = "python"
version = "3.10"
replacement = "the ast module (ast.parse() to build the tree, compile() to run it). The parser module exposed the old concrete parse tree and was removed with the old parser; ast works on the abstract syntax tree, so code that walked parse-tree nodes must be ported to ast node classes and re-tested"
source = "python-3.10"

[[removed]]
kind = "module"
names = ["symbol"]
distribution = "python"
version = "3.10"
replacement = "the ast module (ast.parse() to build the tree, compile() to run it). The symbol module held the grammar symbol numbers of the old parser, which no longer exists, so code that depended on those numbers must be ported to ast node classes and re-tested"
source = "python-3.10-changelog"

# The existing 3.10 entry lists 24 of the 25 removed collections aliases; AsyncGenerator is the missing one.
[[removed]]
kind = "api"
module = "collections"
names = ["AsyncGenerator"]
distribution = "python"
version = "3.10"
replacement = "collections.abc.AsyncGenerator: import it from collections.abc (the collections alias was removed together with the other ABC aliases)"
source = "python-3.10"

# --------------------------------------------------------------------------------------
# Removed in Python 3.11
# --------------------------------------------------------------------------------------

[[removed]]
kind = "module"
names = ["binhex"]
distribution = "python"
version = "3.11"
replacement = "base64 or binascii for other binary-to-text encodings; there is no standard-library replacement for the BinHex 4 (.hqx) format itself, and binascii.crc_hqx() is still available"
source = "python-3.11"

[[removed]]
kind = "api"
module = "binascii"
names = ["a2b_hqx", "b2a_hqx", "rlecode_hqx", "rledecode_hqx"]
distribution = "python"
version = "3.11"
replacement = "nothing for the BinHex 4 (.hqx) encoding: these functions were removed together with the binhex module (binascii.crc_hqx() stays). If a general binary-to-text encoding is enough, use base64 or binascii.a2b_base64() and b2a_base64()"
source = "python-3.11"

[[removed]]
kind = "api"
module = "inspect"
names = ["formatargspec"]
distribution = "python"
version = "3.11"
replacement = "str(inspect.signature(f)) or inspect.Signature.format() in place of inspect.formatargspec(*inspect.getfullargspec(f)). The text is identical for plain signatures, but annotated defaults are spelled with spaces around '=' (b: int = 1, not b: int=1), so re-check any output that is compared as text"
source = "python-3.11"

[[removed]]
kind = "api"
module = "gettext"
names = ["lgettext", "ldgettext", "lngettext", "ldngettext"]
distribution = "python"
version = "3.11"
replacement = "the str-returning functions gettext(), dgettext(), ngettext() and dngettext() (lgettext -> gettext, ldgettext -> dgettext, lngettext -> ngettext, ldngettext -> dngettext) with the same arguments. The l* variants returned bytes encoded in the locale encoding, so remove any decoding of their result"
source = "python-3.11"

[[removed]]
kind = "api"
module = "gettext"
names = ["bind_textdomain_codeset"]
distribution = "python"
version = "3.11"
replacement = "nothing: translations are always returned as str now, so delete the call, and the codeset argument of gettext.translation() and gettext.install(), which was removed with it"
source = "python-3.11"

[[removed]]
kind = "usage"
names = ["open(path, 'U')"]
pattern = "invalid mode: 'U'"
distribution = "python"
version = "3.11"
replacement = "open(path) or open(path, 'r'): text mode already translates CR, LF and CRLF line endings to a plain newline when reading (universal newlines, the default newline=None), which is what the 'U' flag asked for. Pass newline='' to keep the original line endings, and open binary files with 'rb'"
source = "python-3.11"

[[removed]]
kind = "kwarg"
names = ["random"]
callables = ["random.shuffle"]
distribution = "python"
version = "3.11"
replacement = "random.shuffle(x) without the random argument; it always uses random.random() as its source now. To shuffle with a specific or seeded generator, call shuffle on a random.Random instance (rng = random.Random(seed); rng.shuffle(x)). The permutation for a given seed can differ from the old random=rng.random form, so re-check tests that compare exact shuffles"
source = "python-3.11"

