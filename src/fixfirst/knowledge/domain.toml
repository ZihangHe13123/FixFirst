# ======================================================================================
# urllib3 2.0 (2023-04-26). 2.0.0 and 2.0.1 are yanked on PyPI because of an unrelated streaming bug,
# but 2.0.0 is the first 2.x release and the one the changelog documents.
# ======================================================================================

[[removed]]
kind = "kwarg"
names = ["method_whitelist"]
callables = ["urllib3.util.retry.Retry", "urllib3.util.Retry", "urllib3.Retry", "requests.packages.urllib3.util.retry.Retry", "requests.packages.urllib3.util.Retry", "requests.packages.urllib3.Retry", "requests.adapters.Retry"]
distribution = "urllib3"
version = "2.0"
replacement = "allowed_methods, with the same meaning (the HTTP verbs that may be retried), for example Retry(total=3, allowed_methods=['GET', 'HEAD']). Rename the keyword wherever Retry(...) or Retry.new(...) is called, including the Retry passed to HTTPAdapter(max_retries=...). To retry every verb, pass allowed_methods=None (the old spelling was method_whitelist=False)."
source = "urllib3-2.0"

[[removed]]
kind = "module"
names = ["urllib3.packages", "requests.packages.urllib3.packages"]
distribution = "urllib3"
version = "2.0"
replacement = "the standard library instead of urllib3's vendored six, for example from urllib.parse import urlparse, urlencode in place of from urllib3.packages.six.moves.urllib.parse import urlparse, urlencode (urllib3 2 dropped Python 2 and no longer ships urllib3.packages). Code that really needs six can install the six package and import six or six.moves from it. If the import is inside another installed library, upgrade that library instead of editing site-packages."
source = "urllib3-2.0"

[[removed]]
kind = "api"
module = "urllib3.util.ssl_"
names = ["DEFAULT_CIPHERS"]
distribution = "urllib3"
version = "2.0"
replacement = "an explicit SSL context. urllib3 2 no longer has a DEFAULT_CIPHERS list and uses the cipher suites configured by the operating system. If the code adjusted that list (for example to talk to a legacy server), build the context with create_urllib3_context(ciphers='...') from urllib3.util.ssl_ and pass it as ssl_context to PoolManager or to HTTPAdapter.init_poolmanager(); that call also exists in urllib3 1.26. If the failing import is inside another library (botocore before its urllib3 2 support is the usual one), upgrade it or pin urllib3<2."
source = "urllib3-2.0"

[[removed]]
kind = "usage"
names = ["urllib3 on an ssl module older than OpenSSL 1.1.1"]
pattern = "only supports OpenSSL 1.1.1+, currently the 'ssl' module is compiled with"
distribution = "urllib3"
version = "2.0"
replacement = "a Python interpreter whose ssl module is built against OpenSSL 1.1.1 or newer (for example the Python 3.10+ AWS Lambda runtime, Amazon Linux 2023, RHEL 8 or later, or a python.org, Homebrew, pyenv or uv build of Python), because urllib3 2 refuses to import with an older OpenSSL. If the platform cannot change, pin urllib3<2 (older botocore and requests releases allow it)."
source = "urllib3-2.0"

# ======================================================================================
# Pillow 10.0 (2023-07-01): the removals announced by the 9.1 and 9.2 deprecations
# ======================================================================================

[[removed]]
kind = "api"
module = "PIL.Image"
names = ["ANTIALIAS"]
distribution = "Pillow"
version = "10.0"
replacement = "Image.LANCZOS (or Image.Resampling.LANCZOS on Pillow 9.1 and newer): ANTIALIAS was only another name for LANCZOS, so im.resize(size, Image.ANTIALIAS) becomes im.resize(size, Image.LANCZOS) with the same constant value and the same result. Image.LANCZOS also exists in old Pillow releases and is not deprecated, so it keeps the code working on every version; the same applies to im.thumbnail(size, Image.ANTIALIAS)."
source = "pillow-10.0"

# ======================================================================================
# networkx 3.0 (2023-01-07): numpy.matrix / scipy.sparse matrix API, nx.info, gpickle, pagerank/hits variants, Ordered* graphs
# ======================================================================================

[[removed]]
kind = "api"
module = "networkx"
names = ["from_numpy_matrix"]
distribution = "networkx"
version = "3.0"
replacement = "from_numpy_array(A, parallel_edges=False, create_using=None), which takes the same arguments and builds the same graph from a numpy array. The conversion functions that returned or consumed numpy.matrix were removed in NetworkX 3.0 in favour of the array versions."
source = "networkx-3.0"

[[removed]]
kind = "api"
module = "networkx"
names = ["to_numpy_matrix"]
distribution = "networkx"
version = "3.0"
replacement = "to_numpy_array(G, nodelist=None, dtype=None, order=None, multigraph_weight=sum, weight='weight', nonedge=0.0), which takes the same arguments but returns a numpy.ndarray instead of a numpy.matrix: A * B is then element-wise, so use A @ B (or np.dot) for the matrix product, and wrap the result in np.asmatrix(...) only if matrix semantics are really needed."
source = "networkx-3.0"

[[removed]]
kind = "api"
module = "networkx"
names = ["write_gpickle", "read_gpickle"]
distribution = "networkx"
version = "3.0"
replacement = "the standard pickle module: with open(path, 'wb') as f: pickle.dump(G, f, pickle.HIGHEST_PROTOCOL) in place of nx.write_gpickle(G, path), and with open(path, 'rb') as f: G = pickle.load(f) in place of nx.read_gpickle(path). Only unpickle files you trust."
source = "networkx-3.0"

# ======================================================================================
# openai 1.0 (2023-11-06): the module-level API of 0.28 (openai.ChatCompletion, openai.error, ...) was removed.
# Releases 1.0.0 and 1.1.x raise AttributeError for the old class names; from 1.2.0 on each name is an APIRemovedInV1
# proxy whose call raises an error with the text matched below (kind = usage).
# ======================================================================================

[[removed]]
kind = "usage"
names = ["openai.ChatCompletion"]
pattern = "You tried to access openai.ChatCompletion, but this is no longer supported in openai>=1.0.0"
distribution = "openai"
version = "1.0"
replacement = "client = openai.OpenAI(api_key=...) and client.chat.completions.create(model=..., messages=[...]), then read response.choices[0].message.content instead of response['choices'][0]['message']['content']: responses are pydantic models, not dicts (response.model_dump() gives a dict). openai.ChatCompletion.acreate becomes await openai.AsyncOpenAI().chat.completions.create(...), and with stream=True the chunks are read as chunk.choices[0].delta.content. If the project cannot migrate yet, pin openai==0.28.1 (the last 0.x release)."
source = "openai-1.0"

[[removed]]
kind = "usage"
names = ["openai.Completion"]
pattern = "You tried to access openai.Completion, but this is no longer supported in openai>=1.0.0"
distribution = "openai"
version = "1.0"
replacement = "client.completions.create(model=..., prompt=...) on a client = openai.OpenAI(api_key=...), reading response.choices[0].text instead of response['choices'][0]['text']: responses are pydantic models, not dicts (response.model_dump() gives a dict). Chat models are called through client.chat.completions.create instead, and openai.Completion.acreate becomes await openai.AsyncOpenAI().completions.create(...). If the project cannot migrate yet, pin openai==0.28.1 (the last 0.x release)."
source = "openai-1.0"

[[removed]]
kind = "usage"
names = ["openai.Embedding"]
pattern = "You tried to access openai.Embedding, but this is no longer supported in openai>=1.0.0"
distribution = "openai"
version = "1.0"
replacement = "client.embeddings.create(model=..., input=...) on a client = openai.OpenAI(api_key=...), reading response.data[0].embedding instead of response['data'][0]['embedding']: responses are pydantic models, not dicts (response.model_dump() gives a dict). openai.Embedding.acreate becomes await openai.AsyncOpenAI().embeddings.create(...). If the project cannot migrate yet, pin openai==0.28.1 (the last 0.x release)."
source = "openai-1.0"

[[removed]]
kind = "module"
names = ["openai.error"]
distribution = "openai"
version = "1.0"
replacement = "the exception classes exported at the top level of the openai package: drop the .error segment, so openai.error.RateLimitError becomes openai.RateLimitError and APIConnectionError, AuthenticationError and APIError keep their names (openai.OpenAIError is the common base class). InvalidRequestError became BadRequestError, Timeout became APITimeoutError and PermissionError became PermissionDeniedError; use openai.APIStatusError to catch any HTTP error status (e.status_code, e.response) and openai.APIConnectionError for network failures. If the project cannot migrate yet, pin openai==0.28.1 (the last 0.x release)."
source = "openai-1.0"

[[removed]]
kind = "api"
module = "openai"
names = ["error"]
distribution = "openai"
version = "1.0"
replacement = "the exception classes exported at the top level of the openai package: drop the .error segment, so openai.error.RateLimitError becomes openai.RateLimitError and APIConnectionError, AuthenticationError and APIError keep their names (openai.OpenAIError is the common base class). InvalidRequestError became BadRequestError, Timeout became APITimeoutError and PermissionError became PermissionDeniedError; use openai.APIStatusError to catch any HTTP error status (e.status_code, e.response) and openai.APIConnectionError for network failures. If the project cannot migrate yet, pin openai==0.28.1 (the last 0.x release)."
source = "openai-1.0"

# kind = usage: since openai 1.0 responses are pydantic models, so subscripting them raises 'X object is not subscriptable'.
[[removed]]
kind = "usage"
names = ["subscripting an openai ChatCompletion response"]
pattern = "'ChatCompletion' object is not subscriptable"
distribution = "openai"
version = "1.0"
replacement = "attribute access on the pydantic response: response.choices[0].message.content in place of response['choices'][0]['message']['content'], and response.usage.total_tokens in place of response['usage']['total_tokens']. Responses are no longer dict-like since openai 1.0; response.model_dump() returns the old dictionary shape when a dict is really needed (for example to serialise it)."
source = "openai-1.0"

