# FixFirst domain knowledge base.
#
# Curated, source-attributed facts that the rule base queries. Each entry cites the
# upstream release notes it comes from. Version numbers state the first release in which
# the name is gone; rules compare them with the version observed in the target interpreter.
# Coverage is intentionally partial: anything missing here falls back to evidence-only
# rules and the learned classifier.

[meta]
title = "FixFirst Python troubleshooting knowledge"
updated = "2026-09-24"

# --------------------------------------------------------------------------------------
# Root causes (diagnosis classes)
# --------------------------------------------------------------------------------------

[causes.missing_dependency]
label = "Missing third-party dependency"
description = "The code imports a third-party distribution that is not installed in the selected interpreter."
remedy = "Install the distribution that provides the import name into the target interpreter, and declare it in the project."

[causes.local_module]
label = "Local module or path problem"
description = "A project module cannot be resolved: it was renamed or moved, the src layout is not on the path, a circular import, or a project file shadows a library or standard-library module."
remedy = "Fix the project's module layout or import path; rename files that shadow other modules."

[causes.version_incompatibility]
label = "Version incompatibility"
description = "The installed library or Python version no longer provides an API the code uses (removed module, attribute, function or keyword argument)."
remedy = "Either update the code to the replacement API or pin the dependency / Python version the code was written for."

[causes.config_missing]
label = "Missing configuration"
description = "A required environment variable, settings key or configuration file is not available at run time."
remedy = "Provide the configuration value (environment variable or config file) described by the project; never commit secrets."

[causes.code_defect]
label = "Defect in project code or tests"
description = "The failure comes from project logic: a wrong assertion, a bug in a function, a typo or a syntax error."
remedy = "Inspect the failing location and the test expectation, fix the code, then re-run the affected tests."

# --------------------------------------------------------------------------------------
# Exception types and the causes they are commonly associated with (for explanations)
# --------------------------------------------------------------------------------------

[[exception]]
type = "ModuleNotFoundError"
candidates = ["missing_dependency", "local_module", "version_incompatibility"]
hint = "The import system could not find the module. It may be uninstalled, a moved project module, or a module removed from the standard library."

[[exception]]
type = "ImportError"
candidates = ["version_incompatibility", "local_module", "code_defect"]
hint = "The module was found but a name could not be imported: removed API, circular import, or a misspelt name."

[[exception]]
type = "AttributeError"
candidates = ["version_incompatibility", "local_module", "code_defect", "config_missing"]
hint = "An attribute is missing. Library API removals, shadowed modules, typos and unexpected None values all look like this."

[[exception]]
type = "KeyError"
candidates = ["config_missing", "code_defect"]
hint = "A lookup failed. When the mapping is os.environ, a configuration value is missing; otherwise it is usually a data or logic error."

[[exception]]
type = "FileNotFoundError"
candidates = ["config_missing", "code_defect"]
hint = "A path does not exist. Missing settings files are configuration problems; other paths often indicate a code or data defect."

[[exception]]
type = "TypeError"
candidates = ["code_defect", "version_incompatibility"]
hint = "A call used the wrong arguments. An unexpected keyword for a library call often means the library API changed."

[[exception]]
type = "AssertionError"
candidates = ["code_defect", "version_incompatibility"]
hint = "A test expectation did not hold. When the test counts recorded warnings, a newer Python or library that adds deprecation warnings also looks like this."

[[exception]]
type = "FixtureLookupError"
candidates = ["missing_dependency", "code_defect"]
hint = "pytest could not find a fixture the test asks for: the pytest plugin that provides it is not installed, or the fixture is defined where this test cannot see it."

