[[removed]]
kind = "usage"
names = ["sqlalchemy MetaData.drop_all() without an engine"]
pattern = "drop_all() missing 1 required positional argument: 'bind'"
distribution = "SQLAlchemy"
version = "2.0"
replacement = "the engine passed explicitly: metadata.drop_all(engine) (or a connection inside engine.begin()). MetaData.bind was removed, so assigning metadata.bind = engine has no effect in 2.0."
source = "sqlalchemy-2-execute"

[[removed]]
kind = "usage"
names = ["sqlalchemy MetaData.reflect() without an engine"]
pattern = "reflect() missing 1 required positional argument: 'bind'"
distribution = "SQLAlchemy"
version = "2.0"
replacement = "metadata.reflect(bind=engine), with the engine or connection passed explicitly. MetaData.bind was removed, so assigning metadata.bind = engine has no effect in 2.0."
source = "sqlalchemy-2-execute"

[[removed]]
kind = "usage"
names = ["sqlalchemy case([...]) list of whens"]
pattern = 'The "whens" argument to case(), when referring to a sequence of items'
distribution = "SQLAlchemy"
version = "2.0"
replacement = "positional when-clauses: case((cond1, value1), (cond2, value2), else_=default) in place of case([(cond1, value1), (cond2, value2)], else_=default); case(*whens, else_=...) unpacks a list that already exists. The value-lookup form case({1: 'a'}, value=col) is unchanged."
source = "sqlalchemy-2.0-select-positional"

[[removed]]
kind = "usage"
names = ["sqlalchemy Select.with_only_columns([...])"]
pattern = 'The "entities" argument to Select.with_only_columns()'
distribution = "SQLAlchemy"
version = "2.0"
replacement = "positional entities: stmt.with_only_columns(users.c.id, users.c.name) in place of stmt.with_only_columns([users.c.id, users.c.name]); stmt.with_only_columns(*columns) unpacks an existing list."
source = "sqlalchemy-2.0-select-positional"

[[removed]]
kind = "usage"
names = ["sqlalchemy Table.select(whereclause)"]
pattern = "FromClause.select() takes 1 positional argument but 2 were given"
distribution = "SQLAlchemy"
version = "2.0"
replacement = "the generative form: table.select().where(table.c.id == 1), or select(table).where(...); Table.select() takes no whereclause argument in 2.0."
source = "sqlalchemy-2.0-select-positional"

[[removed]]
kind = "usage"
names = ["sqlalchemy joinedload(relationship name string)"]
pattern = "Strings are not accepted for attribute names in loader options"
distribution = "SQLAlchemy"
version = "2.0"
replacement = "class-bound attributes in loader options: joinedload(User.items) in place of joinedload('items'), selectinload(User.items).selectinload(Item.tags) for a chain, and the same for subqueryload, lazyload, contains_eager and defer."
source = "sqlalchemy-2.0-query-strings"

[[removed]]
kind = "usage"
names = ["sqlalchemy Session(autocommit=True)"]
pattern = "autocommit=True is no longer supported"
distribution = "SQLAlchemy"
version = "2.0"
replacement = "an explicit transaction: with Session(engine) as session, session.begin(): ... (or session.commit() after the work), because a Session never autocommits in 2.0; sessionmaker(bind=engine) with explicit commit() calls replaces sessionmaker(autocommit=True). Re-test that every write path commits."
source = "sqlalchemy-2.0-session-autocommit"

[[removed]]
kind = "usage"
names = ["sqlalchemy Session.begin(subtransactions=True)"]
pattern = "Session.begin() got an unexpected keyword argument 'subtransactions'"
distribution = "SQLAlchemy"
version = "2.0"
replacement = "Session.begin_nested() when a SAVEPOINT is wanted, or no inner begin at all: a 2.0 Session autobegins, so call session.commit() once at the end of the unit of work (or wrap it in with session.begin():). The subtransactions=True flag, whose inner transactions joined the outer one, was removed."
source = "sqlalchemy-2.0-session-autocommit"

[[removed]]
kind = "usage"
names = ["sqlalchemy Query.join(aliased=True)"]
pattern = "Query.join() got an unexpected keyword argument 'aliased'"
distribution = "SQLAlchemy"
version = "2.0"
replacement = "explicit aliases: a = aliased(Item); query.join(User.items.of_type(a)).filter(a.id == 1), and for a chain from an alias query.join(a.children.of_type(b)); aliased=True and from_joinpoint=True were removed."
source = "sqlalchemy-2.0-join-aliased"

[[removed]]
kind = "usage"
names = ["sqlalchemy create_engine(convert_unicode=)"]
pattern = "Invalid argument(s) 'convert_unicode' sent to create_engine()"
distribution = "SQLAlchemy"
version = "2.0"
replacement = "no argument: remove convert_unicode. Python 3 DBAPIs accept and return str natively, so SQLAlchemy 2.0 no longer converts Unicode itself; test text columns with non-ASCII data after the change."
source = "sqlalchemy-2.0-changelog-general"

[[removed]]
kind = "usage"
names = ["sqlalchemy create_engine(encoding=)"]
pattern = "Invalid argument(s) 'encoding' sent to create_engine()"
distribution = "SQLAlchemy"
version = "2.0"
replacement = "no argument: remove encoding=. SQLAlchemy 2.0 always passes Python str to the DBAPI; for a specific connection character set use the driver's own setting in the URL query (for example charset for MySQL drivers or client_encoding for PostgreSQL drivers)."
source = "sqlalchemy-2.0-changelog-general"

[[removed]]
kind = "usage"
names = ["sqlalchemy orm.mapper() function"]
pattern = "The 'sqlalchemy.orm.mapper()' function is removed as of SQLAlchemy 2.0"
distribution = "SQLAlchemy"
version = "2.0"
replacement = "registry.map_imperatively(Class, table) for classical mapping: mapper_registry = registry(); mapper_registry.map_imperatively(Thing, things_table, properties={...}), or declarative classes (class Thing(Base): __tablename__ = ...). from sqlalchemy.orm import registry."
source = "sqlalchemy-2.0-mapper"

[[removed]]
kind = "usage"
names = ["sqlalchemy URL() constructor"]
pattern = "URL.__new__() missing"
distribution = "SQLAlchemy"
version = "2.0"
replacement = "URL.create(drivername, username, password, host, port, database, query), the public constructor since 1.4 (from sqlalchemy.engine import URL; URL.create(drivername='postgresql', username='user', password='pw', host='localhost', database='db')); calling URL(...) directly no longer works in 2.0. A URL is immutable: use url.set(password='...') to derive a changed copy."
source = "sqlalchemy-2.0-changelog-general"

[[removed]]
kind = "usage"
names = ["sqlalchemy legacy annotation on a relationship"]
pattern = "can't be correctly interpreted for Annotated Declarative Table form"
distribution = "SQLAlchemy"
version = "2.0"
replacement = "Mapped[...] annotations (id: Mapped[int] = mapped_column(primary_key=True), children: Mapped[List['Child']] = relationship()), or __allow_unmapped__ = True on the class when existing annotations such as children: List['Child'] = relationship('Child') must stay as they are; ClassVar[...] marks attributes that are not mapped. Mapped annotations also decide nullability (Optional[...] means nullable), so re-check the generated schema."
source = "sqlalchemy-2.0-allow-unmapped"

[[removed]]
kind = "usage"
names = ["sqlalchemy Row.items()"]
pattern = "Could not locate column in row for column 'items'"
distribution = "SQLAlchemy"
version = "2.0"
replacement = "row._mapping.items() (or dict(row._mapping)): Row is a named tuple in 2.0 and the mapping interface moved to the Row._mapping attribute."
source = "sqlalchemy-2.0-row"

[[removed]]
kind = "usage"
names = ["sqlalchemy Row.has_key()"]
pattern = "Could not locate column in row for column 'has_key'"
distribution = "SQLAlchemy"
version = "2.0"
replacement = "'name' in row._mapping: Row is a named tuple in 2.0, so in on the Row itself tests values, and key membership moved to the Row._mapping attribute."
source = "sqlalchemy-2.0-row"

# ------------------------------------------------------------------------------------------
# SQLAlchemy 1.4 -> 2.0: keyword arguments
# ------------------------------------------------------------------------------------------

[[removed]]
kind = "kwarg"
names = ["declarative_base.bind"]
callables = ["sqlalchemy.orm.declarative_base", "sqlalchemy.ext.declarative.declarative_base", "sqlalchemy.orm.decl_api.declarative_base"]
distribution = "SQLAlchemy"
version = "2.0"
replacement = "declarative_base() without bind: Base = declarative_base(); create the tables with Base.metadata.create_all(engine) and give sessions their engine through sessionmaker(bind=engine) or Session(engine)."
source = "sqlalchemy-2.0-changelog-general"

