[[removed]]
kind = "api"
module = "ssl"
names = ["match_hostname"]
distribution = "python"
version = "3.12"
replacement = "hostname checking inside the TLS handshake: an ssl.SSLContext with check_hostname=True (the default of ssl.create_default_context()) and server_hostname passed to SSLContext.wrap_socket(). OpenSSL then matches the certificate and raises ssl.SSLCertVerificationError, so the manual match_hostname(cert, hostname) call can be deleted"
