# FixFirst domain knowledge base.
#
# Curated, source-attributed facts that the rule base queries. Each entry cites the
# upstream release notes or source it comes from. Removal entries name the release in
# which a name is gone; tool failures carry bounded ranges for a specific failure.
# Coverage is intentionally partial: anything missing here falls back to evidence-only
# rules and the learned classifier.

[meta]
title = "FixFirst Python troubleshooting knowledge"
updated = "2026-10-03"

# Tool failures are matched to raw failure mechanisms before their version bounds
# are applied. They are not classifier features or universal Python support claims.
# Lower bounds are inclusive; fixed_version/python_before are exclusive. The lower
# tool bounds limit this knowledge to the registered development range, not the
# first release that introduced the defect. Python coverage is deliberately 3.12
# only; it does not assert compatibility or incompatibility outside that interval.
#
# py 1.11.0's tagged source preserves __spec__ when replacing a lazy module.
# Its changelog records the vendored apipkg update from 1.5 to 2.0:
# https://github.com/pytest-dev/py/blob/1.11.0/CHANGELOG.rst
# Compare the same source in tag 1.10.0, which does not preserve __spec__.
[[tool_failure]]
id = "py-apipkg-spec"
distribution = "py"
affected_from = "1.10.0"
fixed_version = "1.11.0"
python_from = "3.12"
python_before = "3.13"
summary = "py's vendored apipkg can fail with AttributeError: __spec__ while importing the pytest stack; py 1.11.0 preserves this module metadata."
source = "py-1.11-apipkg-spec"

# Upstream #10977 identifies the ast.Str/ast.NameConstant warning in 7.3.1.
# PR #10894 uses ast.Constant on Python >=3.8; the 7.3.2 changelog includes it:
# https://docs.pytest.org/en/7.3.x/changelog.html#pytest-7-3-2-2023-06-10
# Registered probes cover 6.2.5 and the 7.0--7.3 line, including the failing
# 7.3.1 / passing 7.3.2 boundary. The diagnosis additionally requires an actual
# ast.Str DeprecationWarning failure from assertion rewriting, not a warning
# summary or proof of where the warning filter was configured.
[[tool_failure]]
id = "pytest-ast-str"
distribution = "pytest"
affected_from = "6.2.5"
fixed_version = "7.3.2"
python_from = "3.12"
python_before = "3.13"
summary = "pytest assertion rewriting uses deprecated ast.Str on Python 3.12; when that warning terminates the run, pytest 7.3.2's ast.Constant change addresses this specific failure."
source = "pytest-ast-str-fix"

[[input_error]]
id = "numpy-shape"
distribution = "numpy"
action_title = "Correct the reshape dimensions for the actual array size"
guidance = "The requested shape must contain the same number of elements as the input array. Compare the size and shape in the error; adjust the requested dimensions to the required result, using one -1 dimension only when the remaining dimensions divide the size. Preserve the input values and the test's intended result."
source = "numpy-reshape"

[[input_error]]
id = "numpy-axis"
distribution = "numpy"
action_title = "Choose an axis that exists in the input array"
guidance = "Compare the requested axis with the number of dimensions shown in the error. For ndim dimensions valid axes range from -ndim to ndim-1. Choose the axis matching the intended operation; changing the library version does not add a missing dimension."
source = "numpy-axis"

[[input_error]]
id = "yaml-syntax"
distribution = "pyyaml"
action_title = "Correct the YAML syntax at the reported line and column"
guidance = "Inspect the YAML text or file at the parser's marked line and column. Correct the reported brackets, separators or indentation while preserving the required data. Keep safe_load or the selected safe loader; a parser syntax error is not evidence that an older PyYAML is needed."
source = "pyyaml-input"

[[input_error]]
id = "click-value"
distribution = "click"
action_title = "Correct the value rejected by the Click parameter"
guidance = "Compare the supplied value with the parameter's required type, choices or bounds reported in the error. Supply a valid value, or correct an incorrectly specified parameter constraint according to the program's requirements. Preserve validation and the tests; do not bypass validation just to make the check pass."
source = "click-input"

[[input_error]]
id = "version-string"
distribution = "packaging"
action_title = "Handle the non-standard version label before comparing versions"
guidance = "Version accepts PEP 440 version strings. Validate values before comparing them, handle InvalidVersion explicitly, and separate non-standard labels from release versions according to the intended ordering. Preserve the tests and input meaning."
source = "packaging-version"

[[input_error]]
id = "pydantic-missing"
distribution = "pydantic"
action_title = "Check the missing model field against the keys actually supplied"
guidance = "Compare each missing field named in the validation error with the arguments or mapping passed at the reported call. Check whether its value was sent to a different field or a misspelt key. Keep required-field validation. Only if omission is intended and the field permits None should an explicit None default be considered; adding that default does not repair a value sent to the wrong field."
source = "pydantic-optional-2.0"

[[input_error]]
id = "sqlalchemy-no-rows"
distribution = "sqlalchemy"
action_title = "Check whether the SQL result returns rows before reading it"
guidance = "Check result.returns_rows before constructing an iterator or fetching rows. DDL and statements without returning rows need an empty result or another return value appropriate to the caller; preserve their SQL effects. A no-row result cannot supply rows on an older release either. The error alone does not establish an upgrade cause."
source = "sqlalchemy-result-1.4-source"

[[behavior]]
id = "packaging-legacy-parse"
distribution = "packaging"
version = "22.0"
summary = "packaging 22 removed LegacyVersion: the observed packaging.version.parse call now raises InvalidVersion for a non-standard label instead of returning a legacy comparison object."
action_title = "Handle legacy version labels before using packaging.version.parse"
replacement = "Handle InvalidVersion explicitly. If only release versions should participate in comparison, validate with Version and filter non-standard labels before applying max or sorting; if those labels have meaning, give them an explicit ordering separately. Keep the original tests and input values. Version itself was already strict before this change."
source = "packaging-22.0"

[[behavior]]
id = "sqlalchemy-eager-result-iterator"
distribution = "sqlalchemy"
version = "1.4"
summary = "SQLAlchemy 1.4 changed result iterator creation from the lazy 1.3 implementation to eager metadata access. The observed generator is being constructed over a result with no rows; iteration now fails immediately. Consuming such a result already failed on older releases."
action_title = "Check returns_rows before constructing the result iterator"
replacement = "Check cursor.returns_rows before building the generator. For a statement that produces no rows, return an empty iterator or collection according to the caller's contract; otherwise keep the original row mapping. For example, use (convert(row) for row in cursor) if cursor.returns_rows else iter(()). Keep SQL effects and row values unchanged."
source = "sqlalchemy-result-1.4-source"

# Behavior changes are matched using observed values/calls and version context.
# They are compatibility hypotheses, not proof that every failure inside a library
# was caused by an upgrade.
[[behavior]]
id = "numpy-copy-false"
distribution = "numpy"
version = "2.0"
without_version_record = true
summary = "NumPy 2 makes array(..., copy=False) reject inputs that require a copy; the observed numpy.array call raises that specific error."
action_title = "Use numpy.asarray when copying the input is allowed"
replacement = "Replace numpy.array(values, copy=False, ...) with numpy.asarray(values, ...), keeping the dtype and other needed options. If the program truly requires zero copying, keep that requirement and provide a compatible array buffer instead. Do not change the expected values."
source = "numpy-2.0"

[[behavior]]
id = "numpy-solve-vector"
distribution = "numpy"
version = "2.0"
without_version_record = true
summary = "NumPy 2 treats a non-1D b as matrices in linalg.solve. The captured a and b shapes fit the previous batched-vector contract but the call now reports a core-dimension mismatch."
action_title = "Pass the batch of right-hand vectors as explicit column vectors"
replacement = "For the observed batched-vector call, replace numpy.linalg.solve(a, b) with numpy.linalg.solve(a, b[..., None])[..., 0]. Preserve a, b and the expected numeric result; the extra dimension makes the vector interpretation explicit."
source = "numpy-solve-2.0"

[[behavior]]
id = "pydantic-optional-required"
distribution = "pydantic"
version = "2.0"
without_version_record = true
summary = "Pydantic V2 requires an Optional field when its declaration has no default. The actual missing field is nullable without a default and the supplied input has no unknown field names."
action_title = "Give the optional model field an explicit None default"
replacement = "Locate the missing Optional field in the model declaration, and add = None if omitting that field is intended (for example email: Optional[str] = None). Keep other required fields and validation intact. Optional controls whether None is allowed; the explicit default controls omission."
source = "pydantic-optional-2.0"

[[behavior]]
id = "numpy-scalar-repr"
distribution = "numpy"
version = "2.0"
summary = "NumPy 2 includes the scalar type in repr output; the compared strings differ only by that wrapper."
action_title = "Format the NumPy scalar explicitly when building the output"
replacement = 'Use str(value), or !s instead of !r in the scalar format, when the required output is the plain numeric text. Keep the expected numeric value and the tests unchanged; avoid replacing all numeric values with strings.'
source = "numpy-scalar-representation"

[[behavior]]
id = "numpy-scalar-promotion"
distribution = "numpy"
version = "2.0"
summary = "NumPy 2 preserves a NumPy float scalar when it is combined with a Python float; the observed JSON call rejects the resulting scalar."
action_title = "Convert the computed NumPy scalar to a Python float before JSON encoding"
replacement = "Convert the computed numeric result with float(result) at the JSON boundary, preserving the numeric JSON value. Do not stringify it or use default=str; check the required precision and run the unchanged tests."
source = "numpy-scalar-promotion"

[[behavior]]
id = "pydantic-number-to-string"
distribution = "pydantic"
version = "2.0"
summary = "Pydantic 2 no longer coerces numeric input into a str field by default; this field rejects a numeric value."
action_title = "Convert the numeric input to text before validating the string field"
replacement = "If the field is intended to accept that number as text, pass str(value) for the affected field before validation. Otherwise correct the input to a string. Preserve other field validation and run the unchanged tests; do not downgrade the whole environment just to suppress validation."
source = "pydantic-number-coercion"

[[behavior]]
id = "yaml-required-loader"
distribution = "pyyaml"
version = "6.0"
summary = "PyYAML 6 requires a Loader argument for yaml.load; this call omits it."
action_title = "Choose an explicit safe YAML loader"
replacement = "For standard YAML data, replace yaml.load(text) with yaml.safe_load(text), or pass Loader=yaml.SafeLoader explicitly. If the application needs custom tags, review the required constructors separately. Keep the tests unchanged and rerun them."
source = "pyyaml-6-loader"

[[behavior]]
id = "click-runner-streams"
distribution = "click"
version = "8.2"
summary = "Click 8.2 removed CliRunner's mix_stderr constructor option and exposes captured stdout and stderr separately."
action_title = "Update CliRunner's stream capture arguments"
replacement = "Remove mix_stderr from the CliRunner constructor. Use result.stdout and result.stderr when the test needs the separate streams; result.output represents their combined terminal output. Preserve the expected behavior and rerun the unchanged tests."
source = "click-8.2-streams"

# --------------------------------------------------------------------------------------
# Root causes (diagnosis classes)
# --------------------------------------------------------------------------------------

[causes.missing_dependency]
label = "Missing third-party dependency"
description = "The code imports a third-party distribution that is not installed in the selected interpreter."
remedy = "Install the distribution that provides the import name into the target interpreter, and declare it in the project."

[causes.local_module]
label = "Local module or path problem"
description = "A project module cannot be resolved: it was renamed or moved, the src layout is not on the path, a circular import, or a project file shadows a library or standard-library module."
remedy = "Fix the project's module layout or import path; rename files that shadow other modules."

[causes.version_incompatibility]
label = "Version incompatibility"
description = "The installed library or Python version no longer provides an API the code uses (removed module, attribute, function or keyword argument)."
remedy = "Either update the code to the replacement API or pin the dependency / Python version the code was written for."

[causes.config_missing]
label = "Missing configuration"
description = "A required environment variable, settings key or configuration file is not available at run time."
remedy = "Provide the configuration value (environment variable or config file) described by the project; never commit secrets."

[causes.code_defect]
label = "Defect in project code or tests"
description = "The failure comes from project logic: a wrong assertion, a bug in a function, a typo or a syntax error."
remedy = "Inspect the failing location and the test expectation, fix the code, then re-run the affected tests."

# --------------------------------------------------------------------------------------
# Exception types and the causes they are commonly associated with (for explanations)
# --------------------------------------------------------------------------------------

[[exception]]
type = "ModuleNotFoundError"
candidates = ["missing_dependency", "local_module", "version_incompatibility"]
hint = "The import system could not find the module. It may be uninstalled, a moved project module, or a module removed from the standard library."

[[exception]]
type = "ImportError"
candidates = ["version_incompatibility", "local_module", "code_defect"]
hint = "The module was found but a name could not be imported: removed API, circular import, or a misspelt name."

[[exception]]
type = "AttributeError"
candidates = ["version_incompatibility", "local_module", "code_defect", "config_missing"]
hint = "An attribute is missing. Library API removals, shadowed modules, typos and unexpected None values all look like this."

[[exception]]
type = "KeyError"
candidates = ["config_missing", "code_defect"]
hint = "A lookup failed. When the mapping is os.environ, a configuration value is missing; otherwise it is usually a data or logic error."

[[exception]]
type = "FileNotFoundError"
candidates = ["config_missing", "code_defect"]
hint = "A path does not exist. Missing settings files are configuration problems; other paths often indicate a code or data defect."

[[exception]]
type = "TypeError"
candidates = ["code_defect", "version_incompatibility"]
hint = "A call used the wrong arguments. An unexpected keyword for a library call often means the library API changed."

[[exception]]
type = "AssertionError"
candidates = ["code_defect", "version_incompatibility"]
hint = "A test expectation did not hold. When the test counts recorded warnings, a newer Python or library that adds deprecation warnings also looks like this."

[[exception]]
type = "FixtureLookupError"
candidates = ["missing_dependency", "code_defect"]
hint = "pytest could not find a fixture the test asks for: the pytest plugin that provides it is not installed, or the fixture is defined where this test cannot see it."

