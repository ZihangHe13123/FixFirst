# ==========================================================================================
# Execution-verified additions, tier 1 (2026-10-03)
# Each block was checked by running the interpreter or library before and after the stated release (scripts/knowledge_verify); tier 1 = names users hit most often on current releases.
# ==========================================================================================

# ==================================================================================================
# TIER 1 - recommended: errors users hit often, current releases
# ==================================================================================================

# --------------------------------------------------------------------------------------------------
# Python standard library 3.10-3.14
# --------------------------------------------------------------------------------------------------

# --------------------------------------------------------------------------------------
# Removed in Python 3.10
# --------------------------------------------------------------------------------------

[[removed]]
kind = "kwarg"
names = ["loop"]
callables = ["asyncio.sleep", "asyncio.gather", "asyncio.wait", "asyncio.wait_for", "asyncio.as_completed", "asyncio.shield", "asyncio.Lock", "asyncio.Event", "asyncio.Condition", "asyncio.Semaphore", "asyncio.BoundedSemaphore", "asyncio.Queue"]
distribution = "python"
version = "3.10"
replacement = "the same call without loop=: since Python 3.10 these asyncio functions and classes always use the running event loop (await asyncio.sleep(1) instead of await asyncio.sleep(1, loop=loop)). If the code deliberately uses a loop other than the running loop of the current thread, for example one running in another thread, submit the coroutine with asyncio.run_coroutine_threadsafe() instead of passing loop=. Re-test code that relied on passing a loop"
source = "python-3.10"

# --------------------------------------------------------------------------------------
# Removed in Python 3.11
# --------------------------------------------------------------------------------------

[[removed]]
kind = "api"
module = "inspect"
names = ["getargspec", "ArgSpec"]
distribution = "python"
version = "3.11"
replacement = "inspect.getfullargspec() and its result type inspect.FullArgSpec, or inspect.signature() for new code. FullArgSpec has seven fields (args, varargs, varkw, defaults, kwonlyargs, kwonlydefaults, annotations): the third is called varkw where ArgSpec called it keywords, and the result must not be unpacked into four names (use getfullargspec(f)[:4] or attribute access). getargspec raised ValueError for functions with keyword-only parameters or annotations; getfullargspec accepts them"
source = "python-3.11"

[[removed]]
kind = "usage"
names = ["open(path, 'rU')"]
pattern = "invalid mode: 'rU'"
distribution = "python"
version = "3.11"
replacement = "open(path) or open(path, 'r'): text mode already translates CR, LF and CRLF line endings to a plain newline when reading (universal newlines, the default newline=None), which is what the 'U' flag asked for. Pass newline='' to keep the original line endings, and open binary files with 'rb'"
source = "python-3.11"

[[removed]]
kind = "usage"
names = ["random.sample() of a set"]
pattern = "For dicts or sets, use sorted(d)."
distribution = "python"
version = "3.11"
replacement = "random.sample(sorted(population), k), or random.sample(list(population), k) when the order of the result does not matter: since Python 3.11 the population must be a sequence, and sets are no longer converted automatically. Sort first when the result must be reproducible for a given seed, because set iteration order is not stable between runs"
source = "python-3.11"

[[removed]]
kind = "usage"
names = ["re inline flags after the start of a pattern"]
pattern = "global flags not at the start of the expression"
distribution = "python"
version = "3.11"
replacement = "the same pattern with the global flag moved to the very beginning, for example (?i)abc instead of abc(?i), or passed as flags=re.IGNORECASE. Before 3.11 such a mid-pattern flag already applied to the whole pattern (with a DeprecationWarning), so moving it keeps the old behaviour. Use the scoped form (?i:...) only to limit the flag to part of the pattern, which changes what matches"
source = "python-3.11"

[[removed]]
kind = "usage"
names = ["asyncio.wait() with coroutine objects"]
pattern = "Passing coroutines is forbidden, use tasks explicitly"
distribution = "python"
version = "3.11"
replacement = "tasks instead of bare coroutines: done, pending = await asyncio.wait([asyncio.create_task(c) for c in coros]) (asyncio.ensure_future() also works). The returned done and pending sets then contain those tasks, so read the values with task.result(). If only the results in the original order are needed, await asyncio.gather(*coros) or use asyncio.TaskGroup (3.11 or newer) instead"
source = "python-3.11-changelog"

# --------------------------------------------------------------------------------------
# Removed in Python 3.12
# --------------------------------------------------------------------------------------

[[removed]]
kind = "api"
module = "ssl"
names = ["wrap_socket"]
distribution = "python"
version = "3.12"
replacement = "an ssl.SSLContext: ctx = ssl.create_default_context() and ctx.wrap_socket(sock, server_hostname=host) for a client, or ctx = ssl.create_default_context(ssl.Purpose.CLIENT_AUTH), ctx.load_cert_chain(certfile, keyfile) and ctx.wrap_socket(sock, server_side=True) for a server. The removed function defaulted to cert_reqs=CERT_NONE, sent no SNI and did not check the hostname; the context verifies certificates and the hostname by default, so pass server_hostname, set the trust explicitly (ctx.load_verify_locations(ca_certs)) and do not disable verification just to make an error go away"
source = "python-3.12"

[[removed]]
kind = "api"
module = "pkgutil"
names = ["ImpImporter", "ImpLoader"]
distribution = "python"
version = "3.12"
replacement = "nothing in application code: these pre-PEP 451 import helpers are mostly referenced by old setuptools, pkg_resources and distutils code, so when the traceback points into one of those packages the installed setuptools is too old for this Python (setuptools 65.7.0 raises this AttributeError on 'import pkg_resources'). If the project or a dependency still imports pkg_resources, install a release that works on Python 3.12 and still contains it: pip install 'setuptools>=66.1,<82' (66.1.0 is the first release that imports on Python 3.12; pkg_resources was removed in 82.0.0, so an unbounded 'pip install --upgrade setuptools' turns this error into ModuleNotFoundError: No module named 'pkg_resources'). Otherwise migrate away from pkg_resources (importlib.metadata, importlib.resources). If the failing line is in your own code, use importlib (importlib.machinery.FileFinder, importlib.util.find_spec)"
source = "python-3.12"

[[removed]]
kind = "kwarg"
names = ["keyfile", "certfile"]
callables = ["smtplib.SMTP_SSL", "imaplib.IMAP4_SSL", "poplib.POP3_SSL", "ftplib.FTP_TLS"]
distribution = "python"
version = "3.12"
replacement = "context= (ssl_context= for imaplib.IMAP4_SSL): build the TLS settings with ssl.create_default_context(), call ctx.load_cert_chain(certfile, keyfile) and pass context=ctx. The removed arguments built a legacy context, whereas create_default_context() verifies server certificates and host names, so keep that unless there is a deliberate reason and set the trust (ctx.load_verify_locations) explicitly. Re-test the connection"
source = "python-3.12"

# --------------------------------------------------------------------------------------
# Removed in Python 3.13
# --------------------------------------------------------------------------------------

[[removed]]
kind = "api"
module = "unittest"
names = ["makeSuite"]
distribution = "python"
version = "3.13"
replacement = "unittest.TestLoader().loadTestsFromTestCase(MyTestCase). makeSuite(MyTestCase, prefix, sortUsing, suiteClass) maps to a TestLoader whose testMethodPrefix, sortTestMethodsUsing and suiteClass attributes hold those values (the defaults are the same), so the suite contains the same tests"
source = "python-3.13"

[[removed]]
kind = "kwarg"
names = ["cafile", "capath", "cadefault"]
callables = ["urllib.request.urlopen"]
distribution = "python"
version = "3.13"
