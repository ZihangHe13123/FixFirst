# FixFirst rule base.
#
# Patterns are [subject, predicate, value]; "?x" binds a variable, "?_" matches anything.
# ["not", s, p, v] succeeds when no fact matches (negation as failure, stratified by phase).
# ["test", op, a, b] compares bound values: version_gte, version_lt, in, not_in, eq, ne.
#
# Phases run in order:
#   derive    goal relevance and helper facts from observations
#   diagnose  root causes from observations + domain knowledge (knowledge/domain.toml)
#   fallback  classifier suggestions for issues no diagnosis rule explains
#   plan      next actions; verification re-runs are added by reasoning.py
#
# Base facts come from evidence.py (observations), domain.py (knowledge) and reasoning.py
# (session goal, snapshot availability, classifier suggestions).

# ======================================================================================
# derive: which goal an issue affects
# ======================================================================================

[[rule]]
id = "G01"
phase = "derive"
description = "A test collection failure prevents the collection goal."
when = [["?i", "stage", "collect"]]
then = [["?i", "affects", "collect_tests"], ["?i", "affects", "pass_tests"]]

[[rule]]
id = "G02"
phase = "derive"
description = "Linter findings affect the code-check goal."
when = [["?i", "stage", "lint"]]
then = [["?i", "affects", "check_style"]]

[[rule]]
id = "G03"
phase = "derive"
description = "Failures while running tests (setup, call or teardown) affect the test-run goal."
when = [["?i", "stage", "?s"], ["test", "in", "?s", "setup,call,teardown"]]
then = [["?i", "affects", "pass_tests"]]


[[rule]]
id = "G05"
phase = "derive"
description = "pytest stops before running any test when collection fails, so collection errors block the test-run goal and must be fixed first."
source = "pytest documentation: collection errors interrupt the session"
when = [["?i", "stage", "collect"], ["?i", "tool", "?t"], ["test", "in", "?t", "pytest,pytest_run"]]
then = [["?i", "blocks", "pass_tests"]]

[[rule]]
id = "G07"
phase = "derive"
description = "Any failure reported by pytest, whatever its stage, stands between the project and a passing test suite."
when = [["?i", "tool", "?t"], ["test", "in", "?t", "pytest,pytest_run"]]
then = [["?i", "affects", "pass_tests"]]

[[rule]]
id = "G08"
phase = "derive"
description = "A failure in the collection-only run stops the tests from loading."
when = [["?i", "tool", "pytest"]]
then = [["?i", "affects", "collect_tests"]]

[[rule]]
id = "G09"
phase = "derive"
description = "Anything the code checker reports, including being unable to run, affects the code-check goal."
when = [["?i", "tool", "ruff"]]
then = [["?i", "affects", "check_style"]]

[[rule]]
id = "G06"
phase = "derive"
description = "The object or callable named in the error is defined in the project itself."
when = [["?i", "owner", "?c"], ["?c", "defined_locally", "yes"]]
then = [["?i", "owner_is_local", "yes"]]

[[rule]]
id = "G11"
phase = "derive"
description = "The search checked every candidate with a compatible wheel; none provided the name."
when = [["?i", "api", "?x"], ["?x", "not_in_older_releases", "?_"]]
then = [["?i", "no_older_release_has", "?x"]]

[[rule]]
id = "G10"
phase = "derive"
description = "The failed assertion is about the warnings the test recorded, and some of them are deprecation warnings raised outside the test's own code."
when = [["?i", "asserts_on", "recorded_warnings"], ["?i", "extra_warning", "?x"]]
then = [["?i", "warning_noise", "?x"]]

# ======================================================================================
# diagnose: version incompatibility (knowledge of removed names)
# ======================================================================================

[[rule]]
id = "D01"
phase = "diagnose"
description = "The missing module was removed from the standard library in or before the target Python version."
source = "knowledge: removed standard-library modules"
when = [
  ["?i", "missing_module", "?m"],
  ["?m", "removed_from", "?d"], ["?m", "removed_in_version", "?v"],
  ["?d", "installed_version", "?iv"], ["test", "version_gte", "?iv", "?v"],
]
then = [["?i", "diagnosis", "version_incompatibility"], ["?i", "remedy", "replace_removed"], ["?i", "because", "?m"]]

[[rule]]
id = "D02"
phase = "diagnose"
description = "The code uses a module attribute or imported name that the installed version no longer provides."
source = "knowledge: removed APIs"
when = [
  ["?i", "api", "?x"],
  ["?x", "removed_from", "?d"], ["?x", "removed_in_version", "?v"],
  ["?d", "installed_version", "?iv"], ["test", "version_gte", "?iv", "?v"],
]
then = [["?i", "diagnosis", "version_incompatibility"], ["?i", "remedy", "replace_removed"], ["?i", "because", "?x"]]

[[rule]]
id = "D03"
phase = "diagnose"
description = "The code calls a method name that the installed Python version removed (for example unittest aliases)."
source = "knowledge: removed attributes"
when = [
  ["?i", "attribute", "?x"],
  ["?x", "removed_from", "?d"], ["?x", "removed_in_version", "?v"],
  ["?d", "installed_version", "?iv"], ["test", "version_gte", "?iv", "?v"],
]
then = [["?i", "diagnosis", "version_incompatibility"], ["?i", "remedy", "replace_removed"], ["?i", "because", "?x"]]

[[rule]]
id = "D07"
phase = "diagnose"
description = "The error message is the known signature of a usage that the installed version no longer accepts."
source = "knowledge: removed usages"
when = [
  ["?i", "usage", "?x"],
  ["?x", "removed_from", "?d"], ["?x", "removed_in_version", "?v"],
  ["?d", "installed_version", "?iv"], ["test", "version_gte", "?iv", "?v"],
]
then = [["?i", "diagnosis", "version_incompatibility"], ["?i", "remedy", "replace_removed"], ["?i", "because", "?x"]]

[[rule]]
id = "D04"
phase = "diagnose"
description = "A library call passes a keyword argument that the installed library version removed."
source = "knowledge: removed keyword arguments"
when = [
  ["?i", "kwarg", "?x"],
  ["not", "?i", "owner_is_local", "yes"],
  ["?x", "removed_from", "?d"], ["?x", "removed_in_version", "?v"],
  ["?d", "installed_version", "?iv"], ["test", "version_gte", "?iv", "?v"],
]
then = [["?i", "diagnosis", "version_incompatibility"], ["?i", "remedy", "replace_removed"], ["?i", "because", "?x"]]

[[rule]]
id = "D06"
phase = "diagnose"
description = "A name cannot be imported from an installed library whose version does not satisfy what another installed package requires (pip check)."
source = "pip check"
when = [
  ["?i", "signal", "cannot_import_name"], ["?i", "module", "?m"], ["?m", "provided_by", "?d"],
  ["?d", "required_spec", "?spec"],
]
then = [["?i", "diagnosis", "version_incompatibility"], ["?i", "remedy", "align_required"], ["?i", "because", "?d"]]

[[rule]]
id = "D09"
phase = "diagnose"
description = "Trying releases in a temporary environment showed that an older release still provides the missing name."
source = "release search (versions.py)"
when = [["?i", "api", "?x"], ["?x", "release_search", "?d"], ["?x", "provided_until_release", "?v"]]
then = [["?i", "diagnosis", "version_incompatibility"], ["?i", "remedy", "use_release"], ["?i", "because", "?x"]]

[[rule]]
id = "D05"
phase = "diagnose"
description = "The removed name is used by another installed library, not by the project's own code."
when = [
  ["?i", "remedy", "replace_removed"], ["?i", "because", "?x"], ["?x", "removed_from", "?d"],
  ["?i", "raised_by_library", "?lib"], ["test", "ne", "?lib", "?d"],
]
then = [["?i", "used_by_library", "?lib"]]

# ======================================================================================
# diagnose: local module problems
# ======================================================================================

[[rule]]
id = "D10"
phase = "diagnose"
description = "A project file has the same name as an installed library, and the library's attributes are missing: the project file shadows the library."
when = [
  ["?i", "module", "?m"], ["?m", "is_local", "?p"], ["?m", "provided_by", "?d"],
  ["?i", "signal", "?s"], ["test", "in", "?s", "no_attribute,cannot_import_name,partially_initialized"],
]
then = [["?i", "diagnosis", "local_module"], ["?i", "remedy", "rename_shadow"], ["?i", "because", "?m"]]

[[rule]]
id = "D11"
phase = "diagnose"
description = "A project file has the same name as a standard-library module and hides it."
when = [
  ["?i", "module", "?m"], ["?m", "is_local", "?p"], ["?m", "in_stdlib", "yes"],
  ["?i", "signal", "?s"], ["test", "in", "?s", "no_attribute,cannot_import_name,partially_initialized"],
]
then = [["?i", "diagnosis", "local_module"], ["?i", "remedy", "rename_shadow"], ["?i", "because", "?m"]]

[[rule]]
id = "D12"
phase = "diagnose"
description = "A project file is named like a known third-party package and lacks that package's attributes."
source = "knowledge: import names"
when = [
  ["?i", "module", "?m"], ["?m", "is_local", "?p"], ["?m", "import_name_of", "?d"],
  ["?i", "signal", "no_attribute"],
]
then = [["?i", "diagnosis", "local_module"], ["?i", "remedy", "rename_shadow"], ["?i", "because", "?m"]]

[[rule]]
id = "D13"
phase = "diagnose"
description = "The module exists in the project tree but cannot be found: the package layout or import path is wrong (for example an uninstalled src layout)."
when = [["?i", "missing_module", "?m"], ["?m", "is_local", "?p"], ["not", "?m", "provided_by", "?_"]]
then = [["?i", "diagnosis", "local_module"], ["?i", "remedy", "fix_import_path"], ["?i", "because", "?m"]]

[[rule]]
id = "D14"
phase = "diagnose"
description = "Two project modules import each other before either finishes loading (circular import)."
when = [
  ["?i", "signal", "partially_initialized"], ["?i", "module", "?m"], ["?m", "is_local", "?p"],
  ["not", "?m", "provided_by", "?_"], ["not", "?m", "in_stdlib", "yes"],
]
then = [["?i", "diagnosis", "local_module"], ["?i", "remedy", "break_cycle"], ["?i", "because", "?m"]]

[[rule]]
id = "D15"
phase = "diagnose"
description = "A relative import is used in a module that is not imported as part of a package."
when = [["?i", "signal", "relative_import"]]
then = [["?i", "diagnosis", "local_module"], ["?i", "remedy", "fix_relative_import"]]

[[rule]]
id = "D16"
phase = "diagnose"
description = "No installed, standard or known package has this name, but a similarly named project module exists: it was probably renamed or moved."
when = [
  ["?i", "missing_module", "?m"], ["?m", "similar_local", "?p"],
  ["not", "?m", "provided_by", "?_"], ["not", "?m", "in_stdlib", "yes"], ["not", "?m", "is_local", "?_"],
  ["not", "?m", "import_name_of", "?_"], ["not", "?m", "declared_in", "?_"], ["not", "?m", "removed_from", "?_"],
]
then = [["?i", "diagnosis", "local_module"], ["?i", "remedy", "fix_renamed_module"], ["?i", "because", "?p"]]

# ======================================================================================
# diagnose: missing dependencies
# ======================================================================================

[[rule]]
id = "D20"
phase = "diagnose"
description = "The project declares this dependency but the target interpreter does not provide it."
when = [
  ["?i", "missing_module", "?m"], ["?m", "declared_in", "?src"],
  ["not", "?m", "provided_by", "?_"], ["not", "?m", "is_local", "?_"],
]
then = [["?i", "diagnosis", "missing_dependency"], ["?i", "remedy", "install_declared"], ["?i", "because", "?m"]]

[[rule]]
id = "D21"
phase = "diagnose"
description = "The import name belongs to a known PyPI distribution that is not installed in the target interpreter."
source = "knowledge: import names"
when = [
  ["?i", "missing_module", "?m"], ["?m", "import_name_of", "?d"],
  ["not", "?m", "provided_by", "?_"], ["not", "?m", "is_local", "?_"], ["not", "?m", "in_stdlib", "yes"],
  ["not", "?m", "declared_in", "?_"],
]
then = [["?i", "diagnosis", "missing_dependency"], ["?i", "remedy", "install_known"], ["?i", "because", "?m"]]

[[rule]]
id = "D22"
phase = "diagnose"
description = "The distribution for this import name is declared by the project but is not installed."
source = "knowledge: import names"
when = [
  ["?i", "missing_module", "?m"], ["?m", "import_name_of", "?d"],
  ["?d", "declared_in", "?src"], ["not", "?m", "provided_by", "?_"], ["not", "?m", "is_local", "?_"],
]
then = [["?i", "diagnosis", "missing_dependency"], ["?i", "remedy", "install_known"], ["?i", "because", "?m"]]

[[rule]]
id = "D23"
phase = "diagnose"
description = "The test asks for a fixture that a pytest plugin provides, and that plugin is not installed in the target interpreter."
source = "knowledge: pytest plugin fixtures"
when = [
  ["?i", "missing_fixture", "?f"], ["?f", "provided_by_plugin", "?d"],
  ["environment", "snapshot", "available"], ["not", "?d", "installed_version", "?_"],
  ["not", "?f", "defined_locally", "?_"],
]
then = [["?i", "diagnosis", "missing_dependency"], ["?i", "remedy", "install_plugin"], ["?i", "because", "?d"]]

[[rule]]
id = "D25"
phase = "diagnose"
description = "The test asks for a fixture that the installed plugin release no longer provides."
source = "knowledge: removed fixtures"
when = [
  ["?i", "missing_fixture", "?f"],
  ["?f", "removed_from", "?d"], ["?f", "removed_in_version", "?v"],
  ["?d", "installed_version", "?iv"], ["test", "version_gte", "?iv", "?v"],
]
then = [["?i", "diagnosis", "version_incompatibility"], ["?i", "remedy", "replace_removed"], ["?i", "because", "?f"]]

[[rule]]
id = "D24"
phase = "diagnose"
description = "The missing fixture is defined in the project, but not where this test can see it."
when = [["?i", "missing_fixture", "?f"], ["?f", "defined_locally", "yes"], ["not", "?f", "removed_from", "?_"]]
then = [["?i", "diagnosis", "code_defect"], ["?i", "remedy", "share_fixture"], ["?i", "because", "?f"]]

# ======================================================================================
# diagnose: configuration
# ======================================================================================

[[rule]]
id = "D30"
phase = "diagnose"
description = "The failing lookup is os.environ[...]: a required environment variable is not set."
when = [["?i", "exception", "KeyError"], ["?i", "signal", "environ_lookup"], ["?i", "config_key", "?k"]]
then = [["?i", "diagnosis", "config_missing"], ["?i", "remedy", "provide_env"], ["?i", "because", "?k"]]

[[rule]]
id = "D31"
phase = "diagnose"
description = "The project reports a named configuration value as missing."
when = [["?i", "kind", "explicit_config_missing"], ["?i", "config_key", "?k"]]
then = [["?i", "diagnosis", "config_missing"], ["?i", "remedy", "provide_env"], ["?i", "because", "?k"]]

[[rule]]
id = "D32"
phase = "diagnose"
description = "A configuration-like file (settings, .env, .yaml, .json, .ini, .toml) does not exist."
when = [["?i", "exception", "FileNotFoundError"], ["?i", "signal", "config_file"], ["?i", "missing_file", "?f"]]
then = [["?i", "diagnosis", "config_missing"], ["?i", "remedy", "provide_config_file"], ["?i", "because", "?f"]]

[[rule]]
id = "D33"
phase = "diagnose"
description = "os.getenv returned None and the code then used the value: the environment variable is not set."
when = [["?i", "signal", "nonetype"], ["?i", "signal", "getenv"], ["?i", "config_key", "?k"]]
then = [["?i", "diagnosis", "config_missing"], ["?i", "remedy", "provide_env"], ["?i", "because", "?k"]]

# ======================================================================================
# diagnose: defects in project code
# ======================================================================================

[[rule]]
id = "D40"
phase = "diagnose"
description = "A test assertion failed: the observed behaviour differs from the test's expectation."
when = [["?i", "exception", "AssertionError"], ["not", "?i", "warning_noise", "?_"]]
then = [["?i", "diagnosis", "code_defect"]]

[[rule]]
id = "D44"
phase = "diagnose"
description = "A test that counts recorded warnings fails because the project's own code uses something the installed Python or library now warns about."
when = [
  ["?i", "exception", "AssertionError"], ["?i", "warning_noise", "?x"],
  ["?x", "emitted_by", "?e"], ["test", "eq", "?e", "project"],
]
then = [
  ["?i", "diagnosis", "version_incompatibility"], ["?i", "remedy", "replace_deprecated"], ["?i", "because", "?x"],
  ["?i", "affects_running", "no"],
]

[[rule]]
id = "D45"
phase = "diagnose"
description = "A test that counts recorded warnings fails because an installed library or Python itself adds deprecation warnings the test does not expect."
when = [
  ["?i", "exception", "AssertionError"], ["?i", "warning_noise", "?x"],
  ["?x", "emitted_by", "?e"], ["test", "ne", "?e", "project"],
]
then = [
  ["?i", "diagnosis", "version_incompatibility"], ["?i", "remedy", "count_checked_warnings"], ["?i", "because", "?x"],
  ["?i", "affects_running", "no"],
]

[[rule]]
id = "D47"
phase = "diagnose"
description = "A code-check finding whose rule usually means the code fails or does the wrong thing when it runs."
source = "knowledge: lint rules"
when = [["?i", "lint_rule", "?r"], ["?r", "indicates", "possible_bug"]]
then = [["?i", "lint_finding", "possible_bug"]]

[[rule]]
id = "D48"
phase = "diagnose"
description = "A code-check finding about style, layout or outdated syntax: it does not change how the code runs."
when = [["?i", "lint_rule", "?r"], ["not", "?r", "indicates", "possible_bug"]]
then = [["?i", "lint_finding", "cleanup"], ["?i", "affects_running", "no"]]

[[rule]]
id = "D46"
phase = "diagnose"
description = "The deprecated name the warnings are about is scheduled for removal: the code that uses it will stop working in that release."
source = "knowledge: deprecations"
when = [["?i", "warning_noise", "?x"], ["?x", "scheduled_removal", "?r"]]
then = [["?i", "breaks_in_future", "?x"]]

[[rule]]
id = "D41"
phase = "diagnose"
description = "A programming error raised inside project or test code."
when = [
  ["?i", "exception", "?e"],
  ["test", "in", "?e", "ZeroDivisionError,NameError,SyntaxError,IndentationError,IndexError,UnboundLocalError,RecursionError"],
  ["?i", "raised_in", "?r"], ["test", "in", "?r", "project,test"],
]
then = [["?i", "diagnosis", "code_defect"]]

[[rule]]
id = "D42"
phase = "diagnose"
description = "The imported name does not exist in a project module that loaded correctly."
when = [
  ["?i", "signal", "cannot_import_name"], ["?i", "module", "?m"], ["?m", "is_local", "?p"],
  ["not", "?i", "signal", "partially_initialized"], ["not", "?m", "provided_by", "?_"], ["not", "?m", "in_stdlib", "yes"],
]
then = [["?i", "diagnosis", "code_defect"], ["?i", "remedy", "check_name"], ["?i", "because", "?m"]]

[[rule]]
id = "D43"
phase = "diagnose"
description = "The missing attribute or unexpected argument belongs to a class or function defined in the project."
when = [
  ["?i", "exception", "?e"], ["test", "in", "?e", "AttributeError,TypeError"],
  ["?i", "owner_is_local", "yes"],
]
then = [["?i", "diagnosis", "code_defect"]]

# ======================================================================================
# heuristic: likely causes from general experience, when no rule is certain
# ======================================================================================

[[rule]]
id = "H01"
phase = "heuristic"
status = "hypothesis"
description = "A name cannot be imported from an installed third-party library. Libraries rename and remove names between versions, so a version difference is the likely cause (a misspelt name is the alternative)."
when = [
  ["?i", "signal", "cannot_import_name"], ["?i", "module", "?m"], ["?m", "provided_by", "?d"],
  ["not", "?m", "is_local", "?_"], ["not", "?i", "diagnosis", "?_"], ["not", "?i", "no_older_release_has", "?_"],
]
then = [["?i", "likely", "version_incompatibility"], ["?i", "likely_because", "?d"]]

[[rule]]
id = "H02"
phase = "heuristic"
status = "hypothesis"
description = "A module of an installed third-party library lacks an attribute the code uses and no project file shadows it: the installed version probably removed or renamed it."
when = [
  ["?i", "exception", "AttributeError"], ["?i", "signal", "no_attribute"], ["?i", "module", "?m"],
  ["?m", "provided_by", "?d"], ["not", "?m", "is_local", "?_"], ["not", "?m", "in_stdlib", "yes"],
  ["not", "?i", "diagnosis", "?_"], ["not", "?i", "no_older_release_has", "?_"],
]
then = [["?i", "likely", "version_incompatibility"], ["?i", "likely_because", "?d"]]

[[rule]]
id = "H06"
phase = "heuristic"
status = "hypothesis"
description = "The failure is raised inside a library that is a major version newer than the one the project's lock file records: behaviour changed between those versions."
when = [
  ["?i", "raised_by_library", "?d"], ["?d", "tested_version", "?tv"], ["?d", "installed_version", "?iv"],
  ["test", "major_gt", "?iv", "?tv"], ["not", "?i", "diagnosis", "?_"],
]
then = [["?i", "likely", "version_incompatibility"], ["?i", "likely_because", "?d"]]

[[rule]]
id = "H05"
phase = "heuristic"
status = "hypothesis"
description = "None of the older compatible releases checked provides the name: check whether it is misspelt or belongs to another release or package."
when = [["?i", "no_older_release_has", "?x"], ["not", "?i", "diagnosis", "?_"]]
then = [["?i", "likely", "code_defect"], ["?i", "likely_because", "?x"]]

[[rule]]
id = "H03"
phase = "heuristic"
status = "hypothesis"
description = "The failing step runs a setup.py command and the environment has no setuptools; since Python 3.12, new virtual environments no longer include it."
source = "What's New In Python 3.12: venv no longer pre-installs setuptools"
when = [["?i", "runs", "setup.py"], ["dist:setuptools", "not_installed", "yes"], ["not", "?i", "diagnosis", "?_"]]
then = [["?i", "likely", "missing_dependency"], ["?i", "likely_because", "dist:setuptools"]]

[[rule]]
id = "H04"
phase = "heuristic"
status = "hypothesis"
description = "The missing fixture is defined nowhere in the project and FixFirst does not know its plugin; a pytest plugin that is not installed is the usual reason."
when = [
  ["?i", "missing_fixture", "?f"], ["project", "declarations", "available"],
  ["not", "?f", "defined_locally", "?_"], ["not", "?f", "provided_by_plugin", "?_"],
  ["not", "?i", "diagnosis", "?_"],
]
then = [["?i", "likely", "missing_dependency"], ["?i", "likely_because", "?f"]]

# ======================================================================================
# fallback: classifier suggestion when neither rules nor heuristics explain the failure
# ======================================================================================

[[rule]]
id = "F01"
phase = "fallback"
status = "hypothesis"
description = "No diagnosis rule matched; the decision tree trained on labelled cases suggests a likely cause."
when = [["?i", "model_suggests", "?c"], ["not", "?i", "diagnosis", "?_"], ["not", "?i", "likely", "?_"]]
then = [["?i", "suspected", "?c"]]

# ======================================================================================
# plan: gather missing evidence first
# ======================================================================================

[[rule]]
id = "P01"
phase = "plan"
description = "Import or dependency failures need an environment snapshot before any cause can be named."
when = [
  ["?i", "kind", "?k"], ["test", "in", "?k", "import_failure,dependency_conflict"],
  ["not", "environment", "snapshot", "available"],
]
[rule.action]
id = "inspect-environment"
kind = "inspect"
check = "environment"
issue = "?i"
cost = 1
impact = 2
impact_goals = ["collect_tests", "pass_tests"]
title = "Record the current Python environment first"
explanation = "Import or dependency checks failed. FixFirst needs the interpreter and its installed packages before it can tell a missing package from a local module or a removed API. Nothing is installed or changed."
verification = "Review the snapshot: interpreter path, Python version and installed packages"

[[rule]]
id = "P02"
phase = "plan"
description = "Errors about missing attributes or arguments are checked against installed versions, which needs a snapshot."
when = [
  ["?i", "signal", "?s"], ["test", "in", "?s", "no_attribute,unexpected_kwarg,cannot_import_name"],
  ["not", "?i", "diagnosis", "?_"], ["not", "environment", "snapshot", "available"],
]
[rule.action]
id = "inspect-environment"
kind = "inspect"
check = "environment"
issue = "?i"
cost = 1
title = "Record the current Python environment first"
explanation = "The error names a missing attribute, import or argument. Comparing it with the installed library versions needs an environment snapshot. Nothing is installed or changed."
verification = "Review the snapshot: interpreter path, Python version and installed packages"

[[rule]]
id = "P03"
phase = "plan"
description = "Module-level errors need the project's declarations and file layout before a cause can be named."
when = [
  ["?i", "kind", "?k"], ["test", "in", "?k", "import_failure,dependency_conflict"],
  ["environment", "snapshot", "available"], ["not", "project", "declarations", "available"],
]
[rule.action]
id = "inspect-project"
kind = "inspect"
check = "project"
issue = "?i"
cost = 1
title = "Read the project's dependency declarations and layout"
explanation = "Read pyproject.toml, requirements files and setup.cfg, and index the project's modules, so FixFirst can tell a declared-but-missing package from a local module. Nothing is installed."
verification = "Review the declared dependencies, local modules and their sources"

# ======================================================================================
# plan: remedies for diagnosed causes
# ======================================================================================

[[rule]]
id = "P09"
phase = "plan"
description = "The removed API belongs to a library that an installed package requires at an older version: restore the version it requires instead of editing code."
source = "pip check"
when = [
  ["?i", "remedy", "replace_removed"], ["?i", "because", "?x"],
  ["?x", "removed_from", "?d"], ["?x", "removed_in_version", "?v"],
  ["?d", "installed_version", "?iv"], ["?d", "required_spec", "?spec"], ["?d", "required_by", "?who"],
]
[rule.action]
id = "align-{?d}"
kind = "manual_fix"
cause = "version_incompatibility"
issue = "?i"
cost = 1
title = "Install the {?d} version that {?who} requires ({?spec})"
explanation = "{?who} requires {?d}{?spec}, but this environment has {?d} {?iv}, which removed {?x} in {?v}. Install the version {?who} requires, or upgrade {?who} to a release that supports the newer {?d}. Editing library code is not the fix."
pip_install = "{?d}{?spec}"
verification = "Re-run the dependency check and the tests with the same interpreter"

[[rule]]
id = "P08"
phase = "plan"
description = "An installed library still uses a name its dependency removed: pin the dependency or upgrade the library."
when = [
  ["?i", "used_by_library", "?lib"], ["?i", "because", "?x"],
  ["?x", "removed_from", "?d"], ["?x", "removed_in_version", "?v"], ["?d", "installed_version", "?iv"],
  ["not", "?d", "required_spec", "?_"], ["test", "ne", "?d", "dist:python"],
]
[rule.action]
id = "pin-{?d}"
kind = "manual_fix"
cause = "version_incompatibility"
issue = "?i"
cost = 1
title = "Install {?d} below {?v}: the installed {?lib} still uses {?x}"
explanation = "The installed {?lib} (not your code) uses {?x}, which {?d} removed in {?v}; this environment has {?d} {?iv}. Install an older {?d}, or upgrade {?lib} to a release that supports the newer {?d}."
pip_install = "{?d}<{?v}"
verification = "Re-run the tests with the same interpreter"

[[rule]]
id = "P55"
phase = "plan"
description = "An installed library still uses a module or function that Python removed: upgrade the library (pip cannot install another Python)."
when = [
  ["?i", "used_by_library", "?lib"], ["?i", "because", "?x"],
  ["?x", "removed_from", "dist:python"], ["?x", "removed_in_version", "?v"], ["dist:python", "installed_version", "?iv"],
  ["?lib", "installed_version", "?lv"], ["not", "?lib", "unmaintained", "?_"],
]
[rule.action]
id = "upgrade-{?lib}"
kind = "manual_fix"
cause = "version_incompatibility"
issue = "?i"
cost = 1
title = "Upgrade {?lib}: {?lib} {?lv} still uses {?x}, which Python {?v} removed"
explanation = "The installed {?lib} {?lv} (not your code) uses {?x}, which Python removed in {?v}; this environment has Python {?iv}. Install a newer {?lib}; if the project pins {?lib} to an old version, relax that pin. Using Python older than {?v} also works."
pip_install = "{?lib}>{?lv}"
verification = "Re-run the tests with the same interpreter"

[[rule]]
id = "P56"
phase = "plan"
description = "An unmaintained library uses a module Python removed: no newer release exists, so stop depending on it."
source = "knowledge: unmaintained packages"
when = [
  ["?i", "used_by_library", "?lib"], ["?i", "because", "?x"],
  ["?x", "removed_from", "dist:python"], ["?x", "removed_in_version", "?v"],
  ["?lib", "unmaintained", "?last"], ["?lib", "replacement", "?r"],
]
[rule.action]
id = "replace-{?lib}"
kind = "manual_fix"
cause = "version_incompatibility"
issue = "?i"
cost = 2
title = "Stop using {?lib}: its last release, {?last}, uses {?x}, which Python {?v} removed"
explanation = "{?lib} is no longer maintained and no release works on Python {?v} or later. Replace it in the code that imports it: {?r}. Using Python older than {?v} also works, but only postpones the change."
verification = "Re-run the tests with the same interpreter"

[[rule]]
id = "P07"
phase = "plan"
description = "An import fails from a library whose installed version conflicts with a requirement: install the required version."
source = "pip check"
when = [
  ["?i", "remedy", "align_required"], ["?i", "because", "?d"],
  ["?d", "required_spec", "?spec"], ["?d", "required_by", "?who"], ["?d", "installed_version", "?iv"],
]
[rule.action]
id = "align-{?d}"
kind = "manual_fix"
cause = "version_incompatibility"
issue = "?i"
cost = 1
title = "Install the {?d} version that {?who} requires ({?spec})"
explanation = "{?who} requires {?d}{?spec}, but this environment has {?d} {?iv}, and the import fails inside that newer {?d}. Install the version {?who} requires, or upgrade {?who} to a release that supports the newer {?d}."
pip_install = "{?d}{?spec}"
verification = "Re-run the dependency check and the tests with the same interpreter"

[[rule]]
id = "P10"
phase = "plan"
description = "Removed API: adapt the code or pin the version that still provides it."
when = [
  ["?i", "remedy", "replace_removed"], ["?i", "because", "?x"],
  ["?x", "removed_from", "?d"], ["?x", "removed_in_version", "?v"], ["?x", "replacement", "?r"],
  ["?d", "installed_version", "?iv"], ["not", "?d", "required_spec", "?_"],
  ["not", "?i", "used_by_library", "?_"],
]
[rule.action]
id = "update-{?x}"
kind = "manual_fix"
cause = "version_incompatibility"
issue = "?i"
cost = 2
title = "Replace {?x}: removed in {?d} {?v}"
explanation = "The target interpreter has {?d} {?iv}, which no longer provides {?x} (removed in {?v}). Change the code to use {?r}, or pin {?d} below {?v} if the project must keep the old API."
verification = "Re-run the affected tests with the same interpreter"

[[rule]]
id = "P11"
phase = "plan"
description = "Shadowing: rename the project file."
when = [["?i", "remedy", "rename_shadow"], ["?i", "because", "?m"], ["?m", "is_local", "?p"]]
[rule.action]
id = "rename-{?p}"
kind = "manual_fix"
cause = "local_module"
issue = "?i"
cost = 2
title = "Rename {?p}: it hides the real {?m} module"
explanation = "Python imports the project file {?p} instead of the library or standard module {?m}, so its functions appear to be missing. Rename the file, delete stale __pycache__ entries and update imports that meant the project file."
verification = "Re-run the affected tests; the import must resolve to the library"

[[rule]]
id = "P12"
phase = "plan"
description = "Local module not on the import path."
when = [["?i", "remedy", "fix_import_path"], ["?i", "because", "?m"], ["?m", "is_local", "?p"]]
[rule.action]
id = "fix-path-{?m}"
kind = "manual_fix"
cause = "local_module"
issue = "?i"
cost = 2
title = "Make the project module {?m} importable"
explanation = "{?p} exists in the project but the test run cannot import {?m}. For a src layout, install the project in editable mode (pip install -e .) or set pytest's pythonpath; otherwise check the package's location and __init__.py."
verification = "Re-run test collection"

[[rule]]
id = "P13"
phase = "plan"
description = "Renamed or moved module: update the imports."
when = [["?i", "remedy", "fix_renamed_module"], ["?i", "missing_module", "?m"], ["?m", "similar_local", "?p"]]
[rule.action]
id = "fix-import-{?m}"
kind = "manual_fix"
cause = "local_module"
issue = "?i"
cost = 2
title = "Update imports of {?m}: the project has {?p}"
explanation = "No installed package, standard module or known distribution is called {?m}, but the project contains {?p}. The module was probably renamed or moved; update the imports or restore the file. Installing a package with this name would not fix it."
verification = "Re-run test collection"

[[rule]]
id = "P14"
phase = "plan"
description = "Circular import between project modules."
when = [["?i", "remedy", "break_cycle"], ["?i", "because", "?m"]]
[rule.action]
id = "break-cycle-{?m}"
kind = "manual_fix"
cause = "local_module"
issue = "?i"
cost = 3
title = "Break the circular import involving {?m}"
explanation = "{?m} was imported while it was still initialising. Move the shared code into a third module, import inside the function that needs it, or import the module rather than names from it."
verification = "Re-run test collection"

[[rule]]
id = "P15"
phase = "plan"
description = "Relative import outside a package."
when = [["?i", "remedy", "fix_relative_import"]]
[rule.action]
id = "fix-relative-imports"
kind = "manual_fix"
cause = "local_module"
issue = "?i"
cost = 2
title = "Fix relative imports outside a package"
explanation = "A module used a relative import (from . import ...) but was not imported as part of a package. Use absolute imports, or make the directory a package that pytest imports with its package name."
verification = "Re-run test collection"

[[rule]]
id = "P16"
phase = "plan"
description = "Declared dependency missing from the interpreter."
when = [["?i", "remedy", "install_declared"], ["?i", "missing_module", "?m"], ["?m", "declared_in", "?src"]]
[rule.action]
id = "install-{?m}"
kind = "manual_fix"
cause = "missing_dependency"
issue = "?i"
cost = 2
title = "Install the declared dependency that provides {?m}"
explanation = "{?src} declares it, but the target interpreter cannot import {?m}. Install it into this interpreter, or install all of the project's declared dependencies at once. FixFirst does not install anything itself."
pip_install = "{?m}"
verification = "Re-run the project declaration check and test collection"

[[rule]]
id = "P17"
phase = "plan"
description = "Known distribution not installed."
when = [["?i", "remedy", "install_known"], ["?i", "missing_module", "?m"], ["?m", "import_name_of", "?d"]]
[rule.action]
id = "install-{?d}"
kind = "manual_fix"
cause = "missing_dependency"
issue = "?i"
cost = 2
title = "Install {?d}, which provides the import {?m}"
explanation = "The import {?m} comes from the PyPI distribution {?d}, which is not installed in the target interpreter. Install it there and declare it in the project's dependencies."
pip_install = "{?d}"
verification = "Re-run the project declaration check and test collection"

[[rule]]
id = "P18"
phase = "plan"
description = "Environment variable or named setting missing."
when = [["?i", "remedy", "provide_env"], ["?i", "because", "?k"]]
[rule.action]
id = "configure-{?k}"
kind = "manual_fix"
cause = "config_missing"
issue = "?i"
cost = 1
title = "Provide the configuration value {?k}"
explanation = "The code needs {?k} at run time and it is not set. Set it in the shell or the test configuration (for example a .env file the project loads) and document it. Do not commit secret values."
verification = "Re-run the affected tests in an environment where the value is set"

[[rule]]
id = "P19"
phase = "plan"
description = "Configuration file missing."
when = [["?i", "remedy", "provide_config_file"], ["?i", "because", "?f"]]
[rule.action]
id = "config-file-{?f}"
kind = "manual_fix"
cause = "config_missing"
issue = "?i"
cost = 1
title = "Create or point to the configuration file {?f}"
explanation = "The code opens {?f}, which does not exist relative to the working directory. Create it from the project's example or template, or fix the path the code uses."
verification = "Re-run the affected tests"

[[rule]]
id = "P20"
phase = "plan"
description = "Imported name missing from a project module."
when = [["?i", "remedy", "check_name"], ["?i", "because", "?m"], ["?i", "api", "?x"]]
[rule.action]
id = "check-name-{?x}"
kind = "manual_fix"
cause = "code_defect"
issue = "?i"
cost = 2
title = "Fix the import of {?x}: the name is not defined in {?m}"
explanation = "The project module {?m} loaded, but it defines no {?x}. Correct the name in the import or add the missing definition."
verification = "Re-run test collection"

# ======================================================================================
# plan: likely causes (ranked after confirmed remedies)
# ======================================================================================

[[rule]]
id = "P58"
phase = "plan"
description = "Try older releases in a temporary environment to find a verified version that provides the name."
when = [
  ["?i", "likely", "version_incompatibility"], ["?i", "likely_because", "?d"], ["?i", "api", "?x"],
  ["?d", "installed_version", "?iv"], ["not", "?x", "release_search", "?_"],
]
[rule.action]
id = "find-release-{?x}"
kind = "inspect"
check = "version_search"
targets = ["{?d}", "{?x}"]
issue = "?i"
cost = 1
title = "Find an older {?d} that provides {?x}"
explanation = "{?d} {?iv} no longer provides {?x}. FixFirst can try older {?d} releases in a temporary environment with this Python and tell you exactly which one to install. It downloads prebuilt packages from PyPI, runs no build scripts and does not change your environment; it takes up to a few minutes."
verification = "The search result appears as the next step"

[[rule]]
id = "P57"
phase = "plan"
description = "A release search verified a release that provides the name: install that exact version."
when = [
  ["?i", "remedy", "use_release"], ["?i", "because", "?x"], ["?x", "release_search", "?d"],
  ["?x", "provided_until_release", "?v"],
]
[rule.action]
id = "use-release-{?x}"
kind = "manual_fix"
cause = "version_incompatibility"
issue = "?i"
cost = 1
title = "Install {?d} {?v}: this release was verified to provide {?x}"
explanation = "FixFirst installed {?d} {?v} in a temporary environment with this Python and confirmed that it provides {?x}. The command pins that exact version. Re-run the project's tests to check the full environment, or update the code that imports the name. The bounded search may not have checked every newer release."
pip_install = "{?d}=={?v}"
verification = "Re-run the tests with the same interpreter"

[[rule]]
id = "P59"
phase = "plan"
description = "None of the compatible releases checked provides the name: check the spelling and documentation."
when = [["?i", "likely", "code_defect"], ["?i", "likely_because", "?x"], ["?i", "no_older_release_has", "?x"]]
[rule.action]
id = "check-name-{?x}"
kind = "manual_fix"
cause = "code_defect"
issue = "?i"
cost = 2
title = "Check the name {?x}: the older releases checked did not provide it"
explanation = "None of the older releases checked in a temporary environment provided {?x}. Check the spelling and the library's documentation; the name may belong to a newer release, another package, or a release without a compatible wheel for this Python."
verification = "Re-run the tests with the same interpreter"

[[rule]]
id = "P61"
phase = "plan"
description = "Go back to the major version of the library that the project's lock file records."
when = [
  ["?i", "likely", "version_incompatibility"], ["?i", "likely_because", "?d"],
  ["?d", "tested_version", "?tv"], ["?d", "tested_in", "?src"], ["?d", "tested_series_below", "?b"],
  ["?d", "installed_version", "?iv"], ["test", "major_gt", "?iv", "?tv"],
]
[rule.action]
id = "tested-{?d}"
kind = "manual_fix"
cause = "version_incompatibility"
issue = "?i"
cost = 1
title = "Try {?d} below {?b}: the project was tested with {?d} {?tv}, this environment has {?iv}"
explanation = "The failure is raised inside {?d}, and {?src} records that the project worked with {?d} {?tv}; the installed {?iv} is a newer major version, which usually changes behaviour. Install {?d} below {?b} to return to the release series the project was tested with, or update the project for the new version."
pip_install = "{?d}<{?b}"
verification = "Re-run the tests with the same interpreter"

[[rule]]
id = "P31"
phase = "plan"
description = "Likely API change in an installed library: check its changelog, then pin or update."
when = [
  ["?i", "likely", "version_incompatibility"], ["?i", "likely_because", "?d"], ["?i", "api", "?x"],
  ["?d", "installed_version", "?iv"], ["?d", "previous_series_below", "?b"],
]
[rule.action]
id = "check-api-{?x}"
kind = "manual_fix"
cause = "version_incompatibility"
issue = "?i"
cost = 2
title = "Try an older {?d}: {?d} {?iv} no longer provides {?x}"
explanation = "{?x} is not available in the installed {?d} {?iv}. Libraries rename or remove names between versions, so a version difference is the most likely cause; a misspelt name is the other possibility. The command tries the previous release series of {?d}; if the name is still missing, FixFirst suggests going back further. If {?d}'s changelog shows the name was renamed, updating the code is the lasting fix."
pip_install = "{?d}<{?b}"
verification = "Re-run the tests with the same interpreter"

[[rule]]
id = "P32"
phase = "plan"
description = "A build tool the failing step needs is not installed."
when = [["?i", "likely", "missing_dependency"], ["?i", "likely_because", "?d"], ["?i", "runs", "setup.py"]]
[rule.action]
id = "install-{?d}"
kind = "manual_fix"
cause = "missing_dependency"
issue = "?i"
cost = 1
title = "Install {?d}: the failing step needs it and this environment has none"
explanation = "The failing step runs a setup.py command, which needs {?d}, and the environment snapshot shows {?d} is not installed. Since Python 3.12, new virtual environments no longer include it."
verification = "Re-run the tests with the same interpreter"
pip_install = "{?d}"

[[rule]]
id = "P21"
phase = "plan"
description = "A declared pytest plugin is not installed: install it."
when = [
  ["?i", "remedy", "install_plugin"], ["?i", "missing_fixture", "?f"], ["?f", "provided_by_plugin", "?d"],
  ["?d", "declared_in", "?src"],
]
[rule.action]
id = "install-{?d}"
kind = "manual_fix"
cause = "missing_dependency"
issue = "?i"
cost = 1
title = "Install {?d}: the tests use its {?f} fixture"
explanation = "pytest cannot find the {?f} fixture because the plugin that provides it, {?d}, is not installed in the target interpreter. {?src} declares it; installing everything declared there at once avoids fixing one missing package per round."
pip_install = "{?d}"
verification = "Re-run the tests with the same interpreter"

[[rule]]
id = "P22"
phase = "plan"
description = "An undeclared pytest plugin is not installed: install and declare it."
when = [
  ["?i", "remedy", "install_plugin"], ["?i", "missing_fixture", "?f"], ["?f", "provided_by_plugin", "?d"],
  ["not", "?d", "declared_in", "?_"],
]
[rule.action]
id = "install-{?d}"
kind = "manual_fix"
cause = "missing_dependency"
issue = "?i"
cost = 1
title = "Install {?d}: the tests use its {?f} fixture"
explanation = "pytest cannot find the {?f} fixture because the plugin that provides it, {?d}, is not installed in the target interpreter. Install it there and add it to the project's test dependencies."
pip_install = "{?d}"
verification = "Re-run the tests with the same interpreter"

[[rule]]
id = "P23"
phase = "plan"
description = "A project fixture is not visible to the test that needs it."
when = [["?i", "remedy", "share_fixture"], ["?i", "because", "?f"]]
[rule.action]
id = "share-{?f}"
kind = "manual_fix"
cause = "code_defect"
issue = "?i"
cost = 2
title = "Make the {?f} fixture visible to the test"
explanation = "The project defines a function named {?f}, but pytest did not find a fixture by that name for this test. A test only sees fixtures from its own module and from the conftest.py files in its folder and the folders above it. Move the fixture into such a conftest.py, and check that it has the @pytest.fixture decorator."
verification = "Re-run the tests with the same interpreter"

[[rule]]
id = "P24"
phase = "plan"
description = "An unknown fixture is missing: find the plugin among the project's test dependencies."
when = [["?i", "likely", "missing_dependency"], ["?i", "likely_because", "?f"], ["?i", "missing_fixture", "?f"]]
[rule.action]
id = "find-plugin-{?f}"
kind = "manual_fix"
cause = "missing_dependency"
issue = "?i"
cost = 2
title = "Install the pytest plugin that provides the {?f} fixture"
explanation = "No file in the project defines a fixture called {?f}, so it most likely comes from a pytest plugin that is not installed in the target interpreter. Look for the plugin in the project's test dependencies (a [tests] or [dev] extra, or a requirements-dev file) and install them into this interpreter."
verification = "Re-run the tests with the same interpreter"

[[rule]]
id = "P33"
phase = "plan"
description = "Deprecation warnings from the environment break a warning count: count only the expected warnings, or use the Python or library version that does not warn."
source = "knowledge: deprecations"
when = [
  ["?i", "remedy", "count_checked_warnings"], ["?i", "because", "?x"],
  ["?x", "emitted_by", "?e"], ["?x", "emitted_at", "?loc"], ["?x", "warning_text", "?w"],
  ["?i", "recorded_warning_count", "?n"], ["?i", "extra_warning_count", "?k"],
  ["?x", "deprecated_in", "?d"], ["?x", "deprecated_in_version", "?v"], ["?d", "installed_version", "?iv"],
]
[rule.action]
id = "count-expected-warnings-{?x}"
kind = "manual_fix"
cause = "version_incompatibility"
issue = "?i"
cost = 2
title = "Make the test ignore {?e}'s {?x} deprecation warnings"
explanation = "The test counts every warning recorded while it runs. Deprecation warnings from outside your code make up {?k} of the {?n} it recorded, such as the one about {?x} at {?loc}: this environment has {?d} {?iv}, which warns about {?x} since {?v}. To make the test pass, count only the warning the test is about, for example recwarn.pop(UserWarning) instead of len(recwarn) == 1, or run the tests with {?d} older than {?v}."
verification = "Re-run the tests with the same interpreter"

[[rule]]
id = "P35"
phase = "plan"
description = "Deprecation warnings from the environment break a warning count (not in the knowledge base): count only the expected warnings."
when = [
  ["?i", "remedy", "count_checked_warnings"], ["?i", "because", "?x"],
  ["?x", "emitted_by", "?e"], ["?x", "emitted_at", "?loc"], ["?x", "warning_text", "?w"],
  ["?i", "recorded_warning_count", "?n"], ["?i", "extra_warning_count", "?k"],
  ["not", "?x", "deprecated_in_version", "?_"],
]
[rule.action]
id = "count-expected-warnings-{?x}"
kind = "manual_fix"
cause = "version_incompatibility"
issue = "?i"
cost = 2
title = "Make the test ignore {?e}'s {?x} deprecation warnings"
explanation = "The test counts every warning recorded while it runs. Deprecation warnings from outside your code make up {?k} of the {?n} it recorded, such as the one about {?x} at {?loc}; new releases of Python and of libraries add warnings like this. To make the test pass, count only the warning the test is about, for example recwarn.pop(UserWarning) instead of len(recwarn) == 1, or use the Python and library versions the tests were written for."
verification = "Re-run the tests with the same interpreter"

[[rule]]
id = "P34"
phase = "plan"
description = "The project's own call to a deprecated API adds warnings that break a warning count: replace the call."
when = [
  ["?i", "remedy", "replace_deprecated"], ["?i", "because", "?x"],
  ["?x", "emitted_at", "?loc"], ["?x", "warning_text", "?w"],
  ["?i", "recorded_warning_count", "?n"], ["?i", "extra_warning_count", "?k"],
]
[rule.action]
id = "replace-deprecated-{?x}"
kind = "manual_fix"
cause = "version_incompatibility"
issue = "?i"
cost = 2
title = "Replace {?x} at {?loc}: the installed version warns about it"
explanation = "Your code at {?loc} uses {?x}, and the test counts every warning recorded while it runs: deprecation warnings like this one make up {?k} of the {?n} it recorded. Change the code as the warning suggests, and the test passes without changes. Making the test count only the warning it checks also works, but keeps the deprecated call."
verification = "Re-run the tests with the same interpreter"

# ======================================================================================
# plan: classifier suggestion (never replaces evidence-based advice)
# ======================================================================================

[[rule]]
id = "P30"
phase = "plan"
description = "Show the classifier's suggestion as something to check, ranked after evidence-based actions."
when = [["?i", "suspected", "?c"]]
[rule.action]
id = "consider-{?c}"
kind = "inspect"
cause = "?c"
issue = "?i"
cost = 2
title = "Check whether this is a {?c|cause} problem"
explanation = "No rule explains this failure from the recorded evidence. The decision tree trained on labelled cases suggests {?c|cause}. Treat it as a lead to check, not a conclusion."
verification = "Confirm or rule out the suggestion using the original traceback"

# ======================================================================================
# plan: generic advice when no specific remedy is known
# ======================================================================================

[[rule]]
id = "P40"
phase = "plan"
description = "Import failure without an identified cause."
when = [
  ["?i", "kind", "import_failure"], ["not", "?i", "remedy", "?_"], ["not", "?i", "likely", "?_"],
  ["environment", "snapshot", "available"], ["project", "declarations", "available"],
]
[rule.action]
id = "review-import"
kind = "manual_fix"
issue = "?i"
cost = 2
preconditions = ["environment:snapshot:available"]
title = "Check the import path and dependency declarations"
explanation = "The import failed and the recorded evidence does not identify one cause. Compare the failing import with the project layout, the declarations and the installed packages. Do not install a package based on the import name alone."
verification = "Re-run test collection; pip check passing does not prove the import works"

[[rule]]
id = "P41"
phase = "plan"
description = "Declared requirement not satisfied by the installed version."
when = [["?i", "tool", "project"], ["?i", "kind", "dependency_conflict"], ["?i", "component", "?c"], ["project", "declarations", "available"]]
[rule.action]
id = "review-{?i}"
kind = "manual_fix"
issue = "?i"
cost = 2
title = "Check the declaration and installed version of {?c}"
explanation = "The project declares a requirement for {?c} that the target interpreter does not satisfy. Adjust the environment or the declaration according to the project's documentation, then re-check with the same interpreter."
verification = "Re-run the project declaration check (it refreshes the environment), then verify the goal"

[[rule]]
id = "P42"
phase = "plan"
description = "Python version outside the declared range."
when = [["?i", "tool", "project"], ["?i", "kind", "environment_mismatch"], ["project", "declarations", "available"]]
[rule.action]
id = "review-{?i}"
kind = "manual_fix"
issue = "?i"
cost = 2
title = "Check the Python version requirement"
explanation = "The target interpreter's Python version is outside the range the project declares. Use an interpreter that satisfies requires-python, or confirm the declaration is outdated."
verification = "Re-run the project declaration check, then verify the goal"

[[rule]]
id = "P43"
phase = "plan"
description = "Dependency conflict reported by pip."
when = [["?i", "kind", "dependency_conflict"], ["?i", "tool", "?t"], ["test", "ne", "?t", "project"]]
[rule.action]
id = "review-dependency_conflict"
kind = "manual_fix"
issue = "?i"
cost = 2
title = "Resolve the dependency constraint conflict"
explanation = "Compare pip's report with the project's declarations and the installed versions, then adjust them by hand. FixFirst does not guess version numbers or install anything."
verification = "Re-run the dependency consistency check"

[[rule]]
id = "P44"
phase = "plan"
description = "Named configuration reported missing without a specific remedy."
when = [["?i", "kind", "explicit_config_missing"], ["not", "?i", "remedy", "?_"]]
[rule.action]
id = "review-explicit_config_missing"
kind = "manual_fix"
issue = "?i"
cost = 2
title = "Provide the configuration the error names"
explanation = "Set the configuration key named in the error, following the project's documentation. The report records only the key, never its value."
verification = "Re-run the checks for the affected scope"

[[rule]]
id = "P45"
phase = "plan"
description = "Installation log failure."
when = [["?i", "kind", "install_failure"]]
[rule.action]
id = "review-install_failure"
kind = "manual_fix"
issue = "?i"
cost = 2
title = "Find the stage where installation failed"
explanation = "Installation failures can come from the network, build tools or package constraints. Read the original log around the first error before changing versions."
verification = "Repeat the installation and import the log again"

[[rule]]
id = "P46"
phase = "plan"
description = "A check did not produce a usable result."
when = [["?i", "kind", "tool_failure"]]
[rule.action]
id = "review-tool_failure"
kind = "manual_fix"
issue = "?i"
cost = 2
title = "Check that the tool is available and ran to completion"
explanation = "This check produced no valid result. Confirm the tool is installed in the target interpreter and read its original output before running it again."
verification = "Run the same check again"

[[rule]]
id = "P47"
phase = "plan"
description = "Clean-up findings checked against the project's own Ruff settings."
when = [["?i", "lint_finding", "cleanup"], ["project", "ruff_config", "?c"], ["test", "ne", "?c", "none"]]
[rule.action]
id = "cleanup-code"
kind = "manual_fix"
issue = "?i"
cost = 2
title = "Clean up the code-check suggestions"
explanation = "Ruff checked the code against the project's settings in {?c} and suggests style, layout and syntax changes. None of them changes how the code runs. ruff check --fix applies many of them automatically; review the changes before you commit them."
verification = "Re-run the code check"

[[rule]]
id = "P52"
phase = "plan"
description = "Clean-up findings when the project configures another linter, not Ruff."
when = [["?i", "lint_finding", "cleanup"], ["project", "ruff_config", "none"], ["project", "other_linter", "?l"]]
[rule.action]
id = "cleanup-code"
kind = "manual_fix"
issue = "?i"
cost = 2
title = "Clean up the code-check suggestions"
explanation = "This project configures its linter in {?l}, not Ruff, so Ruff used its own default rules. Many of these suggestions are rules the project never adopted, and none of them changes how the code runs. Fix the ones you agree with, or add Ruff settings that match the project's style."
verification = "Re-run the code check"

[[rule]]
id = "P53"
phase = "plan"
description = "Clean-up findings when the project has no linter settings."
when = [["?i", "lint_finding", "cleanup"], ["project", "ruff_config", "none"], ["not", "project", "other_linter", "?_"]]
[rule.action]
id = "cleanup-code"
kind = "manual_fix"
issue = "?i"
cost = 2
title = "Clean up the code-check suggestions"
explanation = "The project has no Ruff settings, so Ruff used its own default rules. These are style, layout and syntax suggestions; none of them changes how the code runs. ruff check --fix applies many of them automatically; review the changes before you commit them."
verification = "Re-run the code check"

[[rule]]
id = "P54"
phase = "plan"
description = "Clean-up findings before the project's settings are known."
when = [["?i", "lint_finding", "cleanup"], ["not", "project", "ruff_config", "?_"]]
[rule.action]
id = "cleanup-code"
kind = "manual_fix"
issue = "?i"
cost = 2
title = "Clean up the code-check suggestions"
explanation = "Ruff suggests style, layout and syntax changes. None of them changes how the code runs. ruff check --fix applies many of them automatically; review the changes before you commit them."
verification = "Re-run the code check"

[[rule]]
id = "P48"
phase = "plan"
description = "Code-check findings that may be bugs."
when = [["?i", "lint_finding", "possible_bug"]]
[rule.action]
id = "review-code_check"
kind = "manual_fix"
issue = "?i"
cost = 2
title = "Check the code-check findings that may be bugs"
explanation = "These Ruff rules usually point at code that fails or does the wrong thing when it runs, such as an undefined name or a syntax error. Look at each location; Details lists the message for each."
verification = "Re-run the code check"

[[rule]]
id = "P49"
phase = "plan"
description = "Failed assertion in a test."
when = [["?i", "kind", "test_assertion"], ["not", "?i", "remedy", "?_"], ["not", "?i", "likely", "?_"]]
[rule.action]
id = "review-test_assertion"
kind = "manual_fix"
issue = "?i"
cost = 2
title = "Compare the failed assertion's expected and actual values"
explanation = "Read the failing test node, its assertion and the original traceback, then check the business expectation against the implementation. Verify the related nodes first, then the full test suite."
verification = "Re-run the related test nodes, then the full suite"

[[rule]]
id = "P50"
phase = "plan"
description = "Exception while running a test, without a specific remedy."
when = [["?i", "kind", "test_runtime_error"], ["not", "?i", "remedy", "?_"], ["not", "?i", "likely", "?_"]]
[rule.action]
id = "review-test_runtime_error"
kind = "manual_fix"
issue = "?i"
cost = 2
title = "Inspect the exception raised while running the test"
explanation = "Use the setup / call / teardown stage to separate fixture preparation, the test body and cleanup. Start from the location where the exception was raised."
verification = "Re-run the related test nodes, then the full suite"

[[rule]]
id = "P51"
phase = "plan"
description = "Failure the parsers could not categorise."
when = [["?i", "kind", "other_unknown"], ["not", "?i", "remedy", "?_"], ["not", "?i", "likely", "?_"]]
[rule.action]
id = "review-other_unknown"
kind = "manual_fix"
issue = "?i"
cost = 2
title = "Read the original output and investigate by hand"
explanation = "The recorded evidence does not support an automatic judgement. Read the original output; business-logic repair is outside FixFirst's scope."
verification = "Re-run the checks for the affected scope"
