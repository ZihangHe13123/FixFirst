name: Source validation

on:
  push:
    branches: [codex/release-0.7.0-public]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install development and notebook dependencies
        run: python -m pip install -e '.[dev,notebooks]' uv
      - name: Full development regression
        run: python -m pytest -q
      - name: Lint source, tests, and public support code
        run: python -m ruff check src tests scripts experiments
