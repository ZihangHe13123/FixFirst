# ssl.create_default_context() sets VERIFY_X509_STRICT from 3.13: certificate chains that 3.12 accepted are rejected

[[removed]]
kind = "usage"
names = ["ssl strict certificate check: Missing Authority Key Identifier"]
pattern = "Missing Authority Key Identifier"
distribution = "python"
version = "3.13"
replacement = "a certificate chain that satisfies RFC 5280, which is the proper fix: re-issue the certificate with the missing part (an Authority Key Identifier extension on every certificate that is not self-issued). ssl.create_default_context() sets ssl.VERIFY_X509_STRICT from Python 3.13, which rejects pre-RFC 5280 or malformed certificates that older releases accepted. If the certificates cannot be replaced, the release notes show how to turn only that check off: ctx = ssl.create_default_context(); ctx.verify_flags &= ~ssl.VERIFY_X509_STRICT (not recommended; certificate and hostname verification stay on)"
source = "python-3.13"

