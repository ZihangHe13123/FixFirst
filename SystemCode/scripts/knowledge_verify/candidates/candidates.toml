distribution = "setuptools"
version = "82.0"
replacement = "importlib.resources: files(package) / 'name' is a Traversable. Use .read_bytes() in place of resource_string (it returns bytes; .read_text() returns str and fails on binary data), .open('rb') in place of resource_stream, [p.name for p in (files(package) / 'name').iterdir()] in place of resource_listdir, (path.is_file() or path.is_dir()) in place of resource_exists and path.is_dir() in place of resource_isdir; the Traversable interface defines is_file() and is_dir() but no exists(), so do not call .exists() on the result of files(). For a real file system path (resource_filename) use 'with importlib.resources.as_file(files(package) / name) as path:' and use the path only inside the with block, because it may be a temporary file for packages inside a zip"
