names = ["pkg_resources"]
distribution = "setuptools"
version = "82.0"
replacement = "importlib.metadata (installed versions, entry points, distribution metadata), importlib.resources (package data files) and the packaging library (versions and requirements) in place of pkg_resources, with PEP 420 implicit namespace packages instead of declare_namespace. If the code or an installed dependency still imports pkg_resources, install setuptools<82: 81.0.0 is the last release that contains it (it warns that pkg_resources is deprecated, and that pin works on Python 3.10 through 3.14). Check first that setuptools is installed at all in the interpreter that runs the code, because Python 3.12+ virtual environments no longer contain it"
