# Receiver recipes for scripts/knowledge_verify/verify_owners.py
#
# A removal block with `owners` says: when an object of one of these library classes lacks attribute N, the library removed N in
# version V. A recipe builds `obj`, a real object of such a class, in a throwaway environment of that library. verify_owners.py runs it
#   * in the last release that still has the attribute (the attribute must exist),
#   * in the first release without it and in later releases (the lookup must raise AttributeError and the product's own receiver_owners()
#     must name the declared owner), and then lets FixFirst diagnose a script that ends in `obj.<name>`.
#
# keys     full knowledge keys ("api:Engine.execute", "attribute:readfp") or fnmatch patterns; an exact key wins over a pattern, and a key
#          that matches two patterns is an error. `{cls}` in keys and setup expands once for every entry of `classes`.
# include  names of [snippets] prepended to the setup.
# extra    further setups, each building another receiver (`obj`) for the same keys: a block with several owners needs a receiver for each.
# before / after / later
#          optional environment overrides ([python, *pip requirements]); by default they come from the check of verify.py that covers the key.
#
# The environments of a check are the ones that proved the removal; they carry the helper packages a recipe needs (openpyxl, reportlab, ...).

[snippets]
django = '''
import django
from django.conf import settings
settings.configure(SECRET_KEY='x', INSTALLED_APPS=['django.contrib.contenttypes', 'django.contrib.auth', 'django.contrib.admin', 'django.contrib.sessions', 'django.contrib.messages'], DATABASES={'default': {'ENGINE': 'django.db.backends.sqlite3', 'NAME': ':memory:'}}, TEMPLATES=[{'BACKEND': 'django.template.backends.django.DjangoTemplates', 'APP_DIRS': True}])
django.setup()
'''
matplotlib = '''
import matplotlib
matplotlib.use('Agg')
import matplotlib.pyplot as plt
'''
sklearn = '''
import numpy as np
rng = np.random.RandomState(0)
X = rng.rand(40, 4)
y = rng.randint(0, 2, size=40)
yr = rng.rand(40)
'''
pillow = '''
