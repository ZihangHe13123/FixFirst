# The new held-out batch (task A1). Copy this file into the private repository
# fixfirst-heldout and add one [[project]] block per project; the scripts need at least one.
# The fields are the same as in examples/real-world/projects.toml:
#
#   id         short name, lowercase with hyphens; the same id is used in the label files
#   repo       owner/name on GitHub
#   ref        the release (tag) to use, e.g. "v1.4.0" or "2.2.0"
#   domain     e.g. "Web: Flask extension", "Data visualisation"
#   layout     project layout and how dependencies are declared,
#              e.g. "src layout, pyproject.toml (hatch)" or "flat package, setup.py, requirements-dev.txt"
#   python     Python version installed by uv, e.g. "3.12" (do not use "system": Windows has none)
#   install    how the project's own files tell a newcomer to install it; each item is what
#              follows `pip install`, run inside the project folder
#   scenario   one sentence: how this environment was made and what was deliberately left out.
#              Write it before running pytest.
#
# Only for a code-defect project (a real bug fix):
#   commit     check out this commit instead of the release (the parent of the fix)
#   tests_from take test files from this commit (the fix itself) ...
#   test_files ... namely these files

[[project]]
id = "click"
repo = "pallets/click"
ref = "8.0.3"
domain = "CLI Development"
layout = "src layout (src/click/), setup.py + setup.cfg; install_requires = colorama (Windows only); test deps in requirements/tests.txt (pytest pinned to 6.2.5, plus attrs/iniconfig/packaging/pluggy/py/pyparsing/toml); tox.ini [testenv] deps = -r requirements/tests.txt"
python = "3.12"
install = ["-e .", "-r requirements/tests.txt"]
scenario = "完全按 tox.ini [testenv] 装：-e . 加 -r requirements/tests.txt（该文件自带 pytest，因此 python -m pytest 可用）。没有故意少装任何东西。"

[[project]]
id = "pytest"
repo = "pytest-dev/pytest"
ref = "6.2.5"
domain = "Testing"
layout = "src layout (src/_pytest/), setup.cfg + setup.py (setuptools-scm); install_requires = attrs/iniconfig/packaging/pluggy/py/toml (+ atomicwrites, colorama on Windows); test deps in [options.extras_require] testing = argcomplete, hypothesis>=3.56, mock, nose, requests, xmlschema; tox.ini [testenv] extras = testing + pygments>=2.7.2"
python = "3.12"
install = ["-e .[testing]", "pygments>=2.7.2"]
scenario = "完全按 tox.ini [testenv] 装：extras = testing 加 pygments>=2.7.2（即 -e .[testing] 与 pygments）。没有故意少装任何东西。"

[[project]]
id = "dateparser"
repo = "scrapinghub/dateparser"
ref = "v1.1.0"
domain = "Date and Time"
layout = "flat package (dateparser/, tests/), setup.py; install_requires = python-dateutil, pytz, regex !=2019.02.19,!=2021.8.27, tzlocal; test deps in tests/requirements.txt (flake8, parameterized, pytest, pytest-cov); tox.ini [testenv] deps = -r tests/requirements.txt; pytest.ini turns on --doctest-modules"
python = "3.12"
install = ["-e .[calendars,fasttext,langdetect]", "-r dateparser_scripts/requirements.txt", "-r tests/requirements.txt", "tzlocal<3.0b1"]
scenario = "[自然路径] 照 tox.ini [testenv] 装：deps = -r dateparser_scripts/requirements.txt（gitpython、ruamel.yaml）加 -r tests/requirements.txt（flake8、parameterized、pytest、pytest-cov）加 tzlocal<3.0b1，再按 setup.py 的 extras_require 装 calendars、langdetect、fasttext 三个 extra。fasttext 是【项目自己声明过的】依赖（setup.py: extras_require={'fasttext': ['fasttext']}，一手证据），不是漏声明；它在这个目标环境（Windows 11 + Python 3.12，没有 MSVC Build Tools）装不上——它是 C++ 扩展，uv 报 error: Microsoft Visual C++ 14.0 or greater is required。所以环境里缺的是一个【已声明但在目标环境装不上】的依赖，裸 pytest 在收集阶段稳定报 ModuleNotFoundError: No module named 'fasttext'（3 个收集错误）。性质是「声明了、装不上」，不是「项目忘记声明 fasttext」。没有为了凑类别故意少装任何东西。另外：tox 自己跑的是 pytest tests（只收 tests/），heldout.py 跑的是裸 python -m pytest，配合 pytest.ini 的 --doctest-modules 会把整个包一起收。环境变量 PYTHONUTF8=1：setup.py 读 README.rst 时没写 encoding=，中文 Windows 默认 GBK 会让 pip install -e . 抛 UnicodeDecodeError——那是环境语言设置不是项目缺陷，所以建环境和跑测试都设了这个变量。"

[[project]]
id = "python-qrcode"
repo = "lincolnloop/python-qrcode"
ref = "v7.3.1"
domain = "Image Processing"
layout = "flat package (qrcode/, qrcode/tests/), setup.cfg + setup.py; install_requires = colorama (Windows only); extras: test = pytest + pytest-cov, pil = pillow; tox.ini [testenv] usedevelop = True, extras = test, pil, and deps = two git://github.com/ojii/... URLs (pymaging, pymaging-png)"
python = "3.12"
install = ["-e .[test,pil]"]
scenario = "按 tox.ini [testenv] 装：extras = test, pil，即 -e .[test,pil]（tox 本身没装，用 uv pip install 执行同一行）。但 tox.ini 的 deps 是两条 git://github.com/ojii/pymaging... URL，GitHub 2022 年已停用 git:// 协议，照文档根本装不上，这两条没装；测试对 pymaging 有 try/except + @skipIf 保护，缺它只会让相关用例 skip，不产生报错。"

[[project]]
id = "httpx"
repo = "encode/httpx"
ref = "0.21.1"
domain = "HTTP Clients"
layout = "flat package (httpx/, tests/), setup.py; the documented install is requirements.txt, whose first line is -e .[cli,http2,brotli] followed by a pinned test toolchain (pytest==6.2.4, pytest-asyncio==0.15.1, pytest-trio==0.7.0, trio==0.19.0, trustme==0.8.0, uvicorn==0.14.0)"
