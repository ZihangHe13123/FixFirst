scenario = "完全按 requirements.txt 装（第一行 -e .[cli,http2,brotli] 装项目本身，其余是锁版本的测试工具链）。没有故意少装任何东西。"

[[project]]
id = "python-ftfy"
repo = "rspeer/python-ftfy"
ref = "v6.0.3"
domain = "Text Processing"
layout = "flat package (ftfy/ with ftfy/tests/ and ftfy/bad_codecs/), setup.py; install_requires = wcwidth; tests_require = pytest; tox.ini [testenv] deps = pytest; pytest.ini runs --doctest-modules over the package (--ignore=setup.py,specimens,scripts,docs)"
